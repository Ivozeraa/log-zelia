name: Fix stale catalog references

on:
  push:
    branches: [agent/fix-horarios-core]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix(horarios): remove stale catalog references') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0

      - name: Remove obsolete catalog memo
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/Horarios.jsx')
          s = p.read_text(encoding='utf-8')
          old = "  const catalogCourseOptions = useMemo(() => CURRICULUM_COURSES.map((curso) => ({ value: curso, label: curso })), []);\n  const catalogFilteredRows = useMemo(() => disciplinaCatalogo.filter((row) => row.curso === catalogCourse && String(row.serie) === String(catalogSerie) && Number(row.semestre) === Number(currentConfig.semestre)).sort((a,b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome)), [disciplinaCatalogo, catalogCourse, catalogSerie, currentConfig.semestre]);\n"
          if old not in s:
              raise SystemExit('Obsolete catalog memo block not found')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx .github/workflows/fix-catalog-reference.yml
          git commit -m "fix(horarios): remove stale catalog references"
          git push origin agent/fix-horarios-core
