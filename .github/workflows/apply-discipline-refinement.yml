name: Apply discipline refinement

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          popup = Path('src/components/ui/SuspensionDecisionPopup.jsx')
          text = popup.read_text(encoding='utf-8')
          text = text.replace('  const [notice, setNotice] = useState("");\n', '  const [notice, setNotice] = useState("");\n  const [expulsionNotice, setExpulsionNotice] = useState(null);\n', 1)
          text = text.replace('  const resultaraEmExpulsao = numeroSuspensao >= 3;\n  const totalPendentes = items.length;\n', '  const resultaraEmExpulsao = numeroSuspensao >= 3;\n  const totalPendentes = items.length;\n  const professorResponsavel = pending?.occurrence?.professor_nome || "Não informado";\n  const ocorrenciasAteLimite = Number(pending?.ocorrenciasAteLimite || numeroSuspensao * 3);\n', 1)

          text = re.sub(r'  const textoCompartilhamento = pending\n    \? `.*?`\n    : "";', '''  const textoCompartilhamento = pending
    ? `🚨 COMUNICADO DE SUSPENSÃO\\n\\n👤 Aluno: ${pending.aluno?.nome || "Aluno"}\\n🏫 Turma: ${pending.turma?.nome || "—"}\\n⚠️ Suspensão: ${numeroSuspensao}ª\\n⏳ Duração: ${days} ${Number(days) === 1 ? "dia" : "dias"}\\n📅 Período: ${formatDate(startDate)} até ${formatDate(endDate)}\\n📝 Motivo: O aluno atingiu ${ocorrenciasAteLimite} ocorrências.\\n📌 Ocorrência que acionou a suspensão: ${pending.occurrence?.descricao || "Não informado"}\\n👨‍🏫 Professor responsável: ${professorResponsavel}\\n\\nRegistro realizado pelo LogZélia – Sistema de Gestão Escolar.`
    : "";''', text, count=1, flags=re.S)

          text = text.replace('ctx.font = "700 48px Arial";', 'ctx.font = \'700 48px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "500 26px Arial";', 'ctx.font = \'600 26px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "700 28px Arial";', 'ctx.font = \'600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "600 38px Arial";', 'ctx.font = \'700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "500 22px Arial";', 'ctx.font = \'500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "700 25px Arial";', 'ctx.font = \'600 25px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "500 30px Arial";', 'ctx.font = \'600 30px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "700 27px Arial";', 'ctx.font = \'600 27px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "700 34px Arial";', 'ctx.font = \'700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "500 23px Arial";', 'ctx.font = \'500 23px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "700 22px Arial";', 'ctx.font = \'600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "500 21px Arial";', 'ctx.font = \'500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('ctx.font = "500 18px Arial";', 'ctx.font = \'500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif\';')
          text = text.replace('font-black', 'font-bold')
          text = text.replace('<div className="space-y-5">', '<div className="space-y-5 font-sans">', 1)

          confirm_start = text.index('  const confirmSuspension = async () => {')
          confirm_end = text.index('  if (!pending) return null;', confirm_start)
          confirm_fn = '''  const confirmSuspension = async () => {
    if (!pending || Number(days) < 1 || !startDate || !endDate || saving) return;
    setSaving(true);
    setNotice("");
    try {
      await onConfirm?.(pending, { days: Number(days), startDate, endDate });
      if (numeroSuspensao >= 3) {
        setExpulsionNotice({ pending, days: Number(days), startDate, endDate });
      } else {
        onDismiss?.(pending.occurrence.id);
      }
    } catch (error) {
      console.error(error);
      setNotice("Não foi possível registrar a suspensão.");
    } finally {
      setSaving(false);
    }
  };

  const closeExpulsion = () => {
    const id = expulsionNotice?.pending?.occurrence?.id;
    setExpulsionNotice(null);
    if (id) onDismiss?.(id);
  };

'''
          text = text[:confirm_start] + confirm_fn + text[confirm_end:]

          marker = '''      </Modal>\n  );\n}'''
          expulsion = '''      </Modal>\n\n      <Modal isOpen={Boolean(expulsionNotice)} onClose={closeExpulsion} title="Expulsão do aluno">\n        {expulsionNotice && (\n          <div className="space-y-5 font-sans">\n            <div className="rounded-2xl border border-red-200 bg-gradient-to-r from-red-50 to-rose-50 p-5">\n              <div className="flex items-start gap-3">\n                <div className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-red-100 text-red-700"><FaExclamationTriangle /></div>\n                <div><p className="text-xs font-semibold uppercase tracking-[0.14em] text-red-700">Medida disciplinar final</p><h3 className="mt-1 text-xl font-bold text-red-900">O aluno será expulso</h3><p className="mt-1 text-sm leading-6 text-red-800">A 3ª suspensão foi registrada e resulta em expulsão.</p></div>\n              </div>\n            </div>\n            <div className="grid gap-3 sm:grid-cols-2">\n              <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4"><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Aluno</p><p className="mt-1 text-lg font-bold text-slate-900">{expulsionNotice.pending.aluno?.nome || "—"}</p>{expulsionNotice.pending.aluno?.matricula && <p className="mt-1 text-xs text-slate-500">Matrícula: {expulsionNotice.pending.aluno.matricula}</p>}</div>\n              <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4"><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Turma</p><p className="mt-1 text-lg font-bold text-slate-900">{expulsionNotice.pending.turma?.nome || "—"}</p></div>\n            </div>\n            <div className="rounded-2xl border border-red-200 bg-red-50 p-4"><p className="text-xs font-semibold uppercase tracking-wide text-red-600">Motivo</p><p className="mt-1 text-base font-semibold text-red-900">O aluno atingiu a 3ª suspensão.</p><p className="mt-2 text-sm leading-6 text-red-800">📌 Ocorrência: {expulsionNotice.pending.occurrence?.descricao || "Não informado"}</p><p className="mt-2 text-xs font-medium text-red-700">👨‍🏫 Professor responsável: {professorResponsavel}</p></div>\n            <div className="grid gap-3 sm:grid-cols-2"><div className="rounded-2xl border border-slate-200 bg-slate-50 p-4"><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Medida</p><p className="mt-1 text-lg font-bold text-slate-900">3ª suspensão — expulsão</p></div><div className="rounded-2xl border border-slate-200 bg-slate-50 p-4"><p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Período</p><p className="mt-1 text-lg font-bold text-slate-900">{formatDate(expulsionNotice.startDate)} até {formatDate(expulsionNotice.endDate)}</p><p className="mt-1 text-xs text-slate-500">{expulsionNotice.days} {Number(expulsionNotice.days) === 1 ? "dia" : "dias"}</p></div></div>\n            <div className="flex flex-col gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:flex-wrap sm:justify-end"><button type="button" onClick={() => copyText(`🚨 COMUNICADO DE EXPULSÃO\\n\\n👤 Aluno: ${expulsionNotice.pending.aluno?.nome || "Aluno"}\\n🏫 Turma: ${expulsionNotice.pending.turma?.nome || "—"}\\n🚫 Medida: 3ª suspensão — expulsão\\n⏳ Duração: ${expulsionNotice.days} ${Number(expulsionNotice.days) === 1 ? "dia" : "dias"}\\n📅 Período: ${formatDate(expulsionNotice.startDate)} até ${formatDate(expulsionNotice.endDate)}\\n📝 Motivo: O aluno atingiu a 3ª suspensão, resultando em expulsão.\\n📌 Ocorrência: ${expulsionNotice.pending.occurrence?.descricao || "Não informado"}\\n👨‍🏫 Professor responsável: ${professorResponsavel}\\n\\nRegistro realizado pelo LogZélia – Sistema de Gestão Escolar.`)} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700"><FaCopy /> Copiar texto</button><button type="button" onClick={() => downloadImage(true, expulsionNotice)} disabled={sharing} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 disabled:opacity-50"><FaDownload /> Baixar imagem</button><button type="button" onClick={() => shareImage(true, expulsionNotice)} disabled={sharing} className="inline-flex items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-800 disabled:opacity-50"><FaShareAlt /> Compartilhar</button></div>\n            <div className="flex justify-end border-t border-slate-200 pt-4"><button type="button" onClick={closeExpulsion} className="rounded-xl bg-red-700 px-5 py-3 text-sm font-bold text-white">Concluir</button></div>\n          </div>\n        )}\n      </Modal>\n  );\n}'''
          if marker not in text:
              raise RuntimeError('Popup closing marker not found')
          text = text.replace(marker, expulsion, 1)
          popup.write_text(text, encoding='utf-8')

          # History: only real suspension records; hide their source occurrence.
          history = Path('src/pages/Occurrences.jsx')
          h = history.read_text(encoding='utf-8')
          h = re.sub(r'const contarSuspensoes = \(ocorrenciasDoAluno\) => \{.*?\n\};', '''const contarSuspensoes = (ocorrenciasDoAluno) => {
  if (!ocorrenciasDoAluno || ocorrenciasDoAluno.length === 0) return 0;
  return ocorrenciasDoAluno.filter((item) => item.categoria === "suspensao").length;
};''', h, count=1, flags=re.S)
          h = re.sub(r'const ordenarESinalizarSuspensoes = \(lista\) => \{.*?\n\};', '''const ordenarESinalizarSuspensoes = (lista) => {
  const ascendente = [...lista].sort((a, b) => (a.data_ocorrido || "").localeCompare(b.data_ocorrido || ""));
  let numeroSuspensao = 0;
  return ascendente.filter((occ) => occ.categoria === "suspensao").map((occ) => {
    numeroSuspensao += 1;
    const origem = occ.ocorrencia_origem_id ? ascendente.find((item) => item.id === occ.ocorrencia_origem_id) : null;
    const ocorrenciasAteOrigem = origem ? ascendente.filter((item) => item.categoria === "ocorrencia" && (item.data_ocorrido || "") <= (origem.data_ocorrido || "")).length : null;
    return { ...occ, descricao: origem ? `O aluno atingiu ${ocorrenciasAteOrigem || numeroSuspensao * 3} ocorrências. Motivo do professor: ${origem.descricao || "Não informado"}.` : (occ.descricao || "Suspensão registrada."), suspensaoGerada: { numero: numeroSuspensao, origem: "aplicada" } };
  }).sort((a, b) => (b.data_ocorrido || "").localeCompare(a.data_ocorrido || ""));
};''', h, count=1, flags=re.S)
          history.write_text(h, encoding='utf-8')

          # Direct third suspension: surface the expulsion modal too.
          home = Path('src/pages/Home.jsx')
          ht = home.read_text(encoding='utf-8')
          ht = ht.replace('if (tipoAdvertencia === "ocorrencia") {\n        const [ocorrenciasResult, suspensoesResult] = await Promise.all([', 'if (tipoAdvertencia === "ocorrencia" || tipoAdvertencia === "suspensao") {\n        const [ocorrenciasResult, suspensoesResult] = await Promise.all([', 1)
          needle = '''          suspensoesPendentes.push({
            occurrence: insertedOccurrence,
            aluno: aluno || { id: alunoId, nome: "Aluno" },
            turma: turma || { id: selectedTurma, nome: "—" },
            suspensoes: totalSuspensoes,
          });'''
          add = '''          suspensoesPendentes.push({
            occurrence: insertedOccurrence,
            aluno: aluno || { id: alunoId, nome: "Aluno" },
            turma: turma || { id: selectedTurma, nome: "—" },
            suspensoes: totalSuspensoes,
            ocorrenciasAteLimite: totalDepois,
          });'''
          ht = ht.replace(needle, add, 1)
          target = '''        }
      }
    }

    setSubmitting(false);'''
          direct = '''        }
      }

      if (tipoAdvertencia === "suspensao" && totalSuspensoes + 1 >= 3) {
        const aluno = alunos.find((item) => String(item.id) === String(alunoId));
        const turma = turmas.find((item) => String(item.id) === String(selectedTurma));
        suspensoesPendentes.push({ occurrence: insertedOccurrence, aluno: aluno || { id: alunoId, nome: "Aluno" }, turma: turma || { id: selectedTurma, nome: "—" }, suspensoes: totalSuspensoes, alreadyApplied: true, days: Math.max(1, Math.floor((new Date(`${dataTermino}T12:00:00`) - new Date(`${dataInicio}T12:00:00`)) / 86400000) + 1), startDate: dataInicio, endDate: dataTermino });
      }
    }

    setSubmitting(false);'''
          if 'alreadyApplied: true' not in ht and target in ht:
              ht = ht.replace(target, direct, 1)
          home.write_text(ht, encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src/components/ui/SuspensionDecisionPopup.jsx','src/pages/Occurrences.jsx','src/pages/Home.jsx'],check=True)
          wf = Path('.github/workflows/apply-discipline-refinement.yml')
          wf.unlink(missing_ok=True)
          subprocess.run(['git','add','-u','.github/workflows/apply-discipline-refinement.yml'],check=True)
          subprocess.run(['git','commit','-m','feat: refinar comunicados e historico disciplinar'],check=True)
          subprocess.run(['git','push'],check=True)
