name: Apply FC PDF patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch FC label and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Horarios.jsx')
          text = path.read_text(encoding='utf-8')

          old = "  if (aula.tipo === 'FC') return 'FC';"
          new = "  if (aula.tipo === 'FC') return ['FC', firstName(aula.professor_nome)].filter(Boolean).join(' - ').toUpperCase();"

          if old not in text:
              raise SystemExit('FC PDF label pattern not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/_patch_fc_pdf.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx .github/workflows/_patch_fc_pdf.yml
          git commit -m "fix: include FC teacher in schedule PDF"
          git push origin main
