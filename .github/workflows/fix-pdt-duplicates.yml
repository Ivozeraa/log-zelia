name: Fix PDT duplicates
on:
  push:
    branches: [agent/fix-horarios-core]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Horarios PDT options
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Horarios.jsx')
          s = p.read_text(encoding='utf-8')
          old = """  const availablePdtTurmaOptions = useMemo(() => {\n    const assigned = new Set(Object.values(currentConfig.pdt || {}).map(String));\n    return professorOptions.filter((option) => !assigned.has(String(option.value)));\n  }, [currentConfig.pdt, professorOptions]);\n"""
          new = """  const availablePdtTurmaOptions = useMemo(() => {\n    const assigned = new Set(Object.values(currentConfig.pdt || {}).map(String));\n    return professorOptions.filter((option) => !assigned.has(String(option.value)));\n  }, [currentConfig.pdt, professorOptions]);\n\n  const pdtOptionsForTurma = (turmaId) => {\n    const currentProfessorId = currentConfig.pdt?.[turmaId];\n    const assignedElsewhere = new Set(\n      Object.entries(currentConfig.pdt || {})\n        .filter(([otherTurmaId]) => String(otherTurmaId) !== String(turmaId))\n        .map(([, professorId]) => String(professorId)),\n    );\n    return professorOptions.filter((option) =>\n      String(option.value) === String(currentProfessorId) || !assignedElsewhere.has(String(option.value)),\n    );\n  };\n"""
          if old not in s:
              raise SystemExit('availablePdtTurmaOptions block not found')
          s = s.replace(old, new, 1)
          old2 = """options={availablePdtTurmaOptions} placeholder=\"Selecione o PDT\""""
          new2 = """options={pdtOptionsForTurma(turmaId)} placeholder=\"Selecione o PDT\""""
          if old2 not in s:
              raise SystemExit('Etapa 6 select not found')
          s = s.replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-pdt-duplicates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx .github/workflows/fix-pdt-duplicates.yml
          git commit -m "fix(horarios): prevent duplicate PDT assignments"
          git push origin HEAD:agent/fix-horarios-core
