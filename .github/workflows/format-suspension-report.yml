name: Format suspension report

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'format: sync suspension report')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ui/SuspensionReportActions.jsx')
          s = p.read_text()
          s = s.replace('import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";')
          s = s.replace('import topoMini from "../../assets/images/topo_mini.png";', 'import topoMini from "../../assets/images/topo_mini.png";\nimport { supabase } from "../../utils/supabase";')
          s = s.replace('  const [notice, setNotice] = useState("");\n', '  const [notice, setNotice] = useState("");\n  const [schoolName, setSchoolName] = useState("Escola");\n\n  useEffect(() => {\n    let cancelled = false;\n    const escolaId = suspension?.escola_id || originOccurrence?.escola_id;\n    if (!escolaId) return undefined;\n    supabase.from("escolas").select("nome").eq("id", escolaId).maybeSingle().then(({ data }) => {\n      if (!cancelled) setSchoolName(data?.nome || "Escola");\n    });\n    return () => { cancelled = true; };\n  }, [suspension?.escola_id, originOccurrence?.escola_id]);\n')
          s = s.replace('📅 *Período:* ${formatDate(startDate)} até ${formatDate(periodoFim)}', '📅 *Período: ${formatDate(startDate)} até ${formatDate(periodoFim)}*')
          s = s.replace('    ctx.font = `700 36px ${font}`;\n    ctx.fillText("COMUNICADO DE SUSPENSÃO", 285, 116);\n    ctx.font = `600 23px ${font}`;\n    ctx.fillText("LogZélia • Gestão Escolar", 285, 67);', '    ctx.fillStyle = "#ffffff";\n    let schoolFontSize = 36;\n    ctx.font = `700 ${schoolFontSize}px ${font}`;\n    while (ctx.measureText(String(schoolName || "Escola")).width > 1010 && schoolFontSize > 24) {\n      schoolFontSize -= 2;\n      ctx.font = `700 ${schoolFontSize}px ${font}`;\n    }\n    ctx.fillText(String(schoolName || "Escola"), 285, 67);\n    ctx.font = `600 23px ${font}`;\n    ctx.fillText("COMUNICADO DE SUSPENSÃO", 285, 116);')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/SuspensionReportActions.jsx
          git diff --cached --quiet || git commit -m "format: sync suspension report"
          git push
          git rm .github/workflows/format-suspension-report.yml
          git commit -m "chore: remove one-time formatting workflow"
          git push
