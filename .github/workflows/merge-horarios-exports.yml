name: Merge Horarios Exports

on:
  push:
    branches: [agent/fix-horarios-core]
    paths:
      - scripts/merge_horarios_exports.py
      - .github/workflows/merge-horarios-exports.yml

permissions:
  contents: write

jobs:
  merge-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ExcelJS
        run: npm install exceljs@^4.4.0 --save
      - name: Apply export patch
        run: python scripts/merge_horarios_exports.py
      - name: Build
        run: npm run build
      - name: Commit and clean up
        run: |
          rm scripts/merge_horarios_exports.py .github/workflows/merge-horarios-exports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx package.json package-lock.json scripts/merge_horarios_exports.py .github/workflows/merge-horarios-exports.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(horarios): add formatted PDF and Excel exports"
          git push origin HEAD:agent/fix-horarios-core
# trigger export merge
