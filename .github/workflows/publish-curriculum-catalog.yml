name: Publish curriculum catalog
on:
  push:
    branches: [agent/fix-horarios-core]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Horarios.jsx')
          s=p.read_text(encoding='utf-8')
          if 'disciplinaCatalogo' in s:
            raise SystemExit('already patched')
          s=s.replace("const getCourseStyle = (turmaNome = '') => COURSE_STYLES.find((course) => course.match.test(turmaNome)) || DEFAULT_COURSE_STYLE;", "const getCourseStyle = (turmaNome = '') => COURSE_STYLES.find((course) => course.match.test(turmaNome)) || DEFAULT_COURSE_STYLE;\nconst CURRICULUM_COURSES = ['Administração','Eletrotécnica','Enfermagem','Informática'];\nconst catalogCourseFromTurma = (nome='') => /eletro/i.test(nome) ? 'Eletrotécnica' : /enferm/i.test(nome) ? 'Enfermagem' : /inform[aá]tica/i.test(nome) ? 'Informática' : /adm/i.test(nome) ? 'Administração' : '';")
          s=s.replace("  const [disciplinaForm, setDisciplinaForm] = useState({ nome: '', area_id: '' });", "  const [disciplinaForm, setDisciplinaForm] = useState({ nome: '', area_id: '' });\n  const [disciplinaCatalogo, setDisciplinaCatalogo] = useState([]);\n  const [catalogModalOpen, setCatalogModalOpen] = useState(false);\n  const [catalogCourse, setCatalogCourse] = useState('');\n  const [catalogSerie, setCatalogSerie] = useState('1');\n  const [catalogSelected, setCatalogSelected] = useState([]);")
          s=s.replace("  const professorUsers = useMemo(", "  const catalogCourseOptions = useMemo(() => CURRICULUM_COURSES.map((curso) => ({ value: curso, label: curso })), []);\n  const catalogFilteredRows = useMemo(() => disciplinaCatalogo.filter((row) => row.curso === catalogCourse && String(row.serie) === String(catalogSerie) && Number(row.semestre) === Number(currentConfig.semestre)).sort((a,b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome)), [disciplinaCatalogo, catalogCourse, catalogSerie, currentConfig.semestre]);\n  const professorUsers = useMemo(",1)
          s=s.replace("          supabase.from('usuarios').select('id, nome, escola_id, role_id, pdt').order('nome', { ascending: true }),", "          supabase.from('usuarios').select('id, nome, escola_id, role_id, pdt').order('nome', { ascending: true }),\n          supabase.from('horario_disciplinas_catalogo').select('id, curso, curriculo, serie, semestre, nome, categoria, area_nome, ordem').eq('ativo', true).order('curso').order('serie').order('semestre').order('ordem'),")
          s=s.replace("        setUsuarios(results[3].data || []);", "        setUsuarios(results[3].data || []);\n        setDisciplinaCatalogo(results[4].data || []);",1)
          marker="  const openDisciplinaModal = (discipline = null) => {"
          fn="""  const openDisciplinaCatalogModal = () => {\n    const firstTurma = byId(turmas, currentConfig.turmas[0]);\n    setCatalogCourse(catalogCourseFromTurma(firstTurma?.nome) || CURRICULUM_COURSES[0]);\n    setCatalogSerie(String((String(firstTurma?.nome || '').match(/(\\d+)\\s*º|\\b(\\d+)\\b/) || [,'1'])[1]));\n    setCatalogSelected([]);\n    setCatalogModalOpen(true);\n  };\n  const closeDisciplinaCatalogModal = () => { setCatalogModalOpen(false); setCatalogSelected([]); };\n  const toggleCatalogDiscipline = (id) => setCatalogSelected((prev) => prev.includes(String(id)) ? prev.filter((v) => v !== String(id)) : [...prev, String(id)]);\n  const addCatalogDisciplines = () => {\n    const rows = disciplinaCatalogo.filter((row) => catalogSelected.includes(String(row.id)));\n    if (!rows.length) return notify.error('Selecione pelo menos uma disciplina.');\n    setCurrentConfig((prev) => {\n      const existing = new Set(prev.disciplinas.map((d) => d.nome.trim().toLowerCase()));\n      const additions = rows.filter((row) => !existing.has(row.nome.trim().toLowerCase())).map((row) => {\n        const area = prev.areas.find((a) => a.nome.trim().toLowerCase() === row.area_nome.trim().toLowerCase()) || prev.areas.find((a) => a.nome === 'Técnica');\n        return area ? { id: newId('disc'), nome: row.nome, area_id: String(area.id) } : null;\n      }).filter(Boolean);\n      return { ...prev, disciplinas: [...prev.disciplinas, ...additions] };\n    });\n    closeDisciplinaCatalogModal();\n    notify.success('Disciplinas adicionadas da base curricular.');\n  };\n\n"""
          s=s.replace(marker,fn+marker,1)
          header="<div className=\"rounded-2xl border border-slate-200 bg-slate-50 p-5 dark:border-slate-700 dark:bg-slate-900\"><div className=\"flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between\"><div><h3 className=\"font-semibold text-slate-900 dark:text-white\">Disciplinas</h3>"
          insert='''<div className="mb-4 rounded-2xl border border-green-200 bg-green-50/70 p-5 dark:border-green-900 dark:bg-green-950/20"><div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"><div><h3 className="font-semibold text-slate-900 dark:text-white">Base curricular</h3><p className="mt-1 text-sm text-slate-600 dark:text-slate-300">Importe disciplinas por curso, série e semestre.</p></div><Button type="button" onClick={openDisciplinaCatalogModal}><FaPlus className="mr-2"/> Importar da base curricular</Button></div></div>'''
          assert header in s
          s=s.replace(header,insert+header,1)
          actual="      <Modal isOpen={disciplinaModalOpen} onClose={closeDisciplinaModal} title={editingDisciplinaId ? 'Editar disciplina' : 'Nova disciplina'}>"
          catalog='''      <Modal isOpen={catalogModalOpen} onClose={closeDisciplinaCatalogModal} title="Base curricular de disciplinas"><div className="space-y-5"><div className="grid gap-4 sm:grid-cols-2"><CustomSelect label="Curso" value={catalogCourse} onChange={setCatalogCourse} options={catalogCourseOptions} placeholder="Selecione o curso"/><CustomSelect label="Série" value={catalogSerie} onChange={setCatalogSerie} options={[1,2,3].map((serie)=>({value:String(serie),label:`${serie}ª série`}))} placeholder="Selecione a série"/></div><div className="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"><strong>{currentConfig.semestre}º semestre</strong></div><div className="max-h-[48vh] space-y-2 overflow-y-auto pr-1">{catalogFilteredRows.map((row)=>{const checked=catalogSelected.includes(String(row.id)); const alreadyAdded=currentConfig.disciplinas.some((d)=>d.nome.trim().toLowerCase()===row.nome.trim().toLowerCase()); return <button key={row.id} type="button" disabled={alreadyAdded} onClick={()=>toggleCatalogDiscipline(row.id)} className={`flex w-full items-start gap-3 rounded-xl border p-3 text-left ${alreadyAdded?'opacity-50':'hover:border-green-400'} ${checked?'border-green-500 bg-green-50':'border-slate-200 bg-white'}`}><span className={`mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border ${checked?'border-green-600 bg-green-600 text-white':'border-slate-300'}`}>{checked&&<FaCheck className="text-xs"/>}</span><span><span className="block font-semibold">{row.nome}</span><span className="block text-[11px] text-slate-500">{row.categoria} · {row.area_nome}</span></span></button>})}</div><div className="flex justify-end gap-3 border-t border-slate-200 pt-4"><Button type="button" variant="secondary" onClick={closeDisciplinaCatalogModal}>Cancelar</Button><Button type="button" onClick={addCatalogDisciplines} disabled={!catalogSelected.length}>Adicionar selecionadas</Button></div></div></Modal>\n\n'''
          assert actual in s
          s=s.replace(actual,catalog+actual,1)
          s=s.replace('    closeLinkModal();\n  };','    closeLinkModal();\n    closeDisciplinaCatalogModal();\n  };',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and publish
        shell: bash
        run: |
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-curriculum-catalog.yml .github/workflows/curriculum-catalog-apply.yml .github/workflows/tmp-curriculum-catalog.yml .github/workflows/curriculum-catalog-export.yml .github/curriculum-trigger.txt .github/curriculum-export-trigger.txt || true
          git add src/pages/Horarios.jsx
          git commit -m "feat(horarios): add curriculum discipline catalog" || exit 0
          git push origin agent/fix-horarios-core
