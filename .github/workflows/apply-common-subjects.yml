name: Apply common subjects intersection

on:
  push:
    branches: [agent/fix-horarios-core]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/fix-common-subjects-direct.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx
          git rm -f scripts/fix-common-subjects-direct.py .github/workflows/apply-common-subjects.yml
          git commit -m "fix(horarios): show common general subjects"
          git push origin agent/fix-horarios-core
