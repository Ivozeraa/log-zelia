name: Fix ranking avatar fallback
on:
  push:
    branches:
      - agent/fix-horarios-core
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Avatar fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ui/Ranking.jsx')
          s = p.read_text(encoding='utf-8')
          old = """  if (avatarUrl) {\n    return (\n      <img\n        src={avatarUrl}\n        alt={nome}\n        style={{ width: size, height: size, borderRadius: '50%', objectFit: 'cover', flexShrink: 0 }}\n      />\n    )\n  }\n\n  return (\n    <div\n"""
          new = """  const [imageFailed, setImageFailed] = useState(false)\n\n  if (avatarUrl && !imageFailed) {\n    return (\n      <img\n        src={avatarUrl}\n        alt={nome}\n        onError={() => setImageFailed(true)}\n        style={{ width: size, height: size, borderRadius: '50%', objectFit: 'cover', flexShrink: 0 }}\n      />\n    )\n  }\n\n  return (\n    <div\n"""
          if old not in s:
              raise SystemExit('Avatar block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-ranking-avatar-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/Ranking.jsx .github/workflows/fix-ranking-avatar-fallback.yml
          git commit -m "fix(ranking): fallback to initials when avatar fails"
          git push origin HEAD:agent/fix-horarios-core
