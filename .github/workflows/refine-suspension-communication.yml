name: Refine suspension communication

on:
  push:
    paths:
      - '.github/workflows/refine-suspension-communication.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar ajuste visual final
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/utils/suspensionReportBridge.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'drawImageContain(ctx, logo, 20, 0, 295, 175);',
                  'drawImageContain(ctx, logo, 5, -10, 350, 210);',
              ),
              (
                  'ctx.fillText("COMUNICADO DE SUSPENSÃO", 335, 74);',
                  'ctx.fillText("COMUNICADO DE SUSPENSÃO", 375, 74);',
              ),
              (
                  'ctx.fillText("LogZélia • Gestão Escolar", 335, 117);',
                  'ctx.fillText("LogZélia • Gestão Escolar", 375, 117);',
              ),
              (
                  'drawImageCoverBottom(ctx, footer, 0, canvas.height, canvas.width, 160);',
                  'drawImageCoverBottom(ctx, footer, 0, canvas.height, canvas.width, 110);',
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if not changed:
              print('Nenhum ajuste visual pendente.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')

      - name: Commitar somente o arquivo do comunicado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/suspensionReportBridge.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: ampliar logo e reduzir footer do comunicado'
          git push
