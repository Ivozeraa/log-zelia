name: Apply professor subject base filter
on:
  push:
    paths:
      - '.github/workflows/fix-professor-subject-base.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Horarios.jsx')
          s=p.read_text()
          old="""  const catalogOptionsForTurmas = (turmaIds = []) => {\n"""
          new="""  const catalogOptionsForTurmas = (turmaIds = [], professorId = linkDraft.professor_id) => {\n"""
          if old not in s: raise SystemExit('catalog function marker not found')
          s=s.replace(old,new,1)
          old="""    const isGeneral = (row) => {\n      const category = normalize(row?.categoria);\n      const name = normalize(row?.nome);\n      return category.includes('formacao geral')\n        || category === 'geral'\n        || GENERAL_DISCIPLINE_NAMES.has(name);\n    };\n\n    if (ids.length === 1) {\n      return rowsFor(curricula[0])\n"""
          new="""    const isGeneral = (row) => {\n      const category = normalize(row?.categoria);\n      const name = normalize(row?.nome);\n      return category.includes('formacao geral')\n        || category === 'geral'\n        || GENERAL_DISCIPLINE_NAMES.has(name);\n    };\n    const isTechnical = (row) => {\n      const category = normalize(row?.categoria);\n      const area = normalize(row?.area_nome);\n      return category.includes('base tecnica')\n        || category.includes('tecnica')\n        || area.includes('tecnic');\n    };\n    const professor = byId(currentConfig.professores, professorId);\n    const professorArea = professor ? byId(currentConfig.areas, professor.area_id) : null;\n    const professorIsTechnical = professorArea?.base === 'tecnica';\n    const subjectFilter = professorIsTechnical ? isTechnical : isGeneral;\n\n    if (ids.length === 1) {\n      return rowsFor(curricula[0])\n        .filter(subjectFilter)\n"""
          if old not in s: raise SystemExit('single subject filter marker not found')
          s=s.replace(old,new,1)
          old="""      rowsFor(curriculum).filter(isGeneral).forEach((row) => map.set(normalize(row.nome), row));\n"""
          new="""      rowsFor(curriculum).filter(subjectFilter).forEach((row) => map.set(normalize(row.nome), row));\n"""
          if old not in s: raise SystemExit('common subject filter marker not found')
          s=s.replace(old,new,1)
          s=s.replace("catalogOptionsForTurmas(turmaIds).map((option)", "catalogOptionsForTurmas(turmaIds, linkDraft.professor_id).map((option)", 1)
          s=s.replace("const materiaOptions = catalogOptionsForTurmas(item.turma_ids);", "const materiaOptions = catalogOptionsForTurmas(item.turma_ids, linkDraft.professor_id);", 1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Publish and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Horarios.jsx
          git diff --cached --quiet || git commit -m 'fix(horarios): filter subjects by professor area'
          git push
          git rm .github/workflows/fix-professor-subject-base.yml
          git commit -m 'chore: remove temporary subject filter workflow'
          git push