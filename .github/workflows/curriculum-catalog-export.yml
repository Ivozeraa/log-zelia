name: Export curriculum catalog patch
on:
  push:
    branches: [agent/fix-horarios-core]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
      - name: Build modified file and diff
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/pages/Horarios.jsx')
          s=p.read_text(encoding='utf-8')
          assert 'disciplinaCatalogo' not in s, 'Catalog patch already present'

          marker="const getCourseStyle = (turmaNome = '') => COURSE_STYLES.find((course) => course.match.test(turmaNome)) || DEFAULT_COURSE_STYLE;"
          assert marker in s
          s=s.replace(marker, marker+"\nconst CURRICULUM_COURSES = ['Administração','Eletrotécnica','Enfermagem','Informática'];\nconst catalogCourseFromTurma = (nome='') => /eletro/i.test(nome) ? 'Eletrotécnica' : /enferm/i.test(nome) ? 'Enfermagem' : /inform[aá]tica/i.test(nome) ? 'Informática' : /adm/i.test(nome) ? 'Administração' : '';",1)

          state_marker="  const [disciplinaForm, setDisciplinaForm] = useState({ nome: '', area_id: '' });"
          assert state_marker in s
          s=s.replace(state_marker, state_marker+"\n  const [disciplinaCatalogo, setDisciplinaCatalogo] = useState([]);\n  const [catalogModalOpen, setCatalogModalOpen] = useState(false);\n  const [catalogCourse, setCatalogCourse] = useState('');\n  const [catalogSerie, setCatalogSerie] = useState('1');\n  const [catalogSelected, setCatalogSelected] = useState([]);",1)

          marker="  const professorUsers = useMemo("
          assert marker in s
          s=s.replace(marker,"  const catalogCourseOptions = useMemo(() => CURRICULUM_COURSES.map((curso) => ({ value: curso, label: curso })), []);\n  const catalogFilteredRows = useMemo(() => disciplinaCatalogo.filter((row) => row.curso === catalogCourse && String(row.serie) === String(catalogSerie) && Number(row.semestre) === Number(currentConfig.semestre)).sort((a,b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome)), [disciplinaCatalogo, catalogCourse, catalogSerie, currentConfig.semestre]);\n\n"+marker,1)

          marker="          supabase.from('usuarios').select('id, nome, escola_id, role_id, pdt').order('nome', { ascending: true }),"
          assert marker in s
          s=s.replace(marker, marker+"\n          supabase.from('horario_disciplinas_catalogo').select('id, curso, curriculo, serie, semestre, nome, categoria, area_nome, ordem').eq('ativo', true).order('curso').order('serie').order('semestre').order('ordem'),",1)
          marker="        setUsuarios(results[3].data || []);"
          assert marker in s
          s=s.replace(marker, marker+"\n        setDisciplinaCatalogo(results[4].data || []);",1)

          marker="  const openDisciplinaModal = (discipline = null) => {"
          assert marker in s
          fn="""  const openDisciplinaCatalogModal = () => {\n    const firstTurma = byId(turmas, currentConfig.turmas[0]);\n    setCatalogCourse(catalogCourseFromTurma(firstTurma?.nome) || CURRICULUM_COURSES[0]);\n    setCatalogSerie(String((String(firstTurma?.nome || '').match(/(\\d+)\\s*º|\\b(\\d+)\\b/) || [,'1'])[1]));\n    setCatalogSelected([]);\n    setCatalogModalOpen(true);\n  };\n\n  const closeDisciplinaCatalogModal = () => { setCatalogModalOpen(false); setCatalogSelected([]); };\n\n  const toggleCatalogDiscipline = (id) => setCatalogSelected((prev) => prev.includes(String(id)) ? prev.filter((v) => v !== String(id)) : [...prev, String(id)]);\n\n  const addCatalogDisciplines = () => {\n    const rows = disciplinaCatalogo.filter((row) => catalogSelected.includes(String(row.id)));\n    if (!rows.length) return notify.error('Selecione pelo menos uma disciplina.');\n    setCurrentConfig((prev) => {\n      const existing = new Set(prev.disciplinas.map((d) => d.nome.trim().toLowerCase()));\n      const additions = rows.filter((row) => !existing.has(row.nome.trim().toLowerCase())).map((row) => {\n        const area = prev.areas.find((a) => a.nome.trim().toLowerCase() === row.area_nome.trim().toLowerCase()) || prev.areas.find((a) => a.nome === 'Técnica');\n        return area ? { id: newId('disc'), nome: row.nome, area_id: String(area.id) } : null;\n      }).filter(Boolean);\n      return { ...prev, disciplinas: [...prev.disciplinas, ...additions] };\n    });\n    closeDisciplinaCatalogModal();\n    notify.success('Disciplinas adicionadas da base curricular.');\n  };\n\n"""
          s=s.replace(marker,fn+marker,1)

          marker="            <div className=\"rounded-2xl border border-slate-200 bg-slate-50 p-5 dark:border-slate-700 dark:bg-slate-900\"><div className=\"flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between\"><div><h3 className=\"font-semibold text-slate-900 dark:text-white\">Disciplinas</h3>"
          assert marker in s
          insert='''            <div className="mb-4 rounded-2xl border border-green-200 bg-green-50/70 p-5 dark:border-green-900 dark:bg-green-950/20"><div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"><div><h3 className="font-semibold text-slate-900 dark:text-white">Base curricular</h3><p className="mt-1 text-sm text-slate-600 dark:text-slate-300">Importe disciplinas por curso, série e semestre.</p></div><Button type="button" onClick={openDisciplinaCatalogModal}><FaPlus className="mr-2"/> Importar da base curricular</Button></div></div>
'''
          s=s.replace(marker,insert+marker,1)

          marker="      <Modal isOpen={disciplinaModalOpen} onClose={closeDisciplinaModal} title={editingDisciplinaId ? 'Editar disciplina' : 'Nova disciplina'}>"
          assert marker in s
          catalog='''      <Modal isOpen={catalogModalOpen} onClose={closeDisciplinaCatalogModal} title="Base curricular de disciplinas"><div className="space-y-5"><div className="grid gap-4 sm:grid-cols-2"><CustomSelect label="Curso" value={catalogCourse} onChange={setCatalogCourse} options={catalogCourseOptions} placeholder="Selecione o curso"/><CustomSelect label="Série" value={catalogSerie} onChange={setCatalogSerie} options={[1,2,3].map((serie)=>({value:String(serie),label:`${serie}ª série`}))} placeholder="Selecione a série"/></div><div className="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-900"><strong>{currentConfig.semestre}º semestre</strong></div><div className="max-h-[48vh] space-y-2 overflow-y-auto pr-1">{catalogFilteredRows.map((row)=>{const checked=catalogSelected.includes(String(row.id)); const alreadyAdded=currentConfig.disciplinas.some((d)=>d.nome.trim().toLowerCase()===row.nome.trim().toLowerCase()); return <button key={row.id} type="button" disabled={alreadyAdded} onClick={()=>toggleCatalogDiscipline(row.id)} className={`flex w-full items-start gap-3 rounded-xl border p-3 text-left ${alreadyAdded?'opacity-50':'hover:border-green-400'} ${checked?'border-green-500 bg-green-50':'border-slate-200 bg-white'}`}><span className={`mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border ${checked?'border-green-600 bg-green-600 text-white':'border-slate-300'}`}>{checked&&<FaCheck className="text-xs"/>}</span><span><span className="block font-semibold">{row.nome}</span><span className="block text-[11px] text-slate-500">{row.categoria} · {row.area_nome}</span></span></button>})}</div><div className="flex justify-end gap-3 border-t border-slate-200 pt-4 dark:border-slate-700"><Button type="button" variant="secondary" onClick={closeDisciplinaCatalogModal}>Cancelar</Button><Button type="button" onClick={addCatalogDisciplines} disabled={!catalogSelected.length}>Adicionar selecionadas</Button></div></div></Modal>

'''
          s=s.replace(marker,catalog+marker,1)

          assert s.count('disciplinaCatalogo') >= 4
          Path('/tmp/Horarios.jsx').write_text(s,encoding='utf-8')
          PY
          cp src/pages/Horarios.jsx /tmp/Horarios.original.jsx
          cp /tmp/Horarios.jsx src/pages/Horarios.jsx
          git diff -- src/pages/Horarios.jsx > /tmp/Horarios.patch
          git diff --stat -- src/pages/Horarios.jsx

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-horarios-patch
          path: |
            /tmp/Horarios.jsx
            /tmp/Horarios.patch
