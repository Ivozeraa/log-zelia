name: Apply suspension report actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'feat: add suspension report actions to warnings')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add report actions to suspension history
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/Occurrences.jsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import { Button } from "../components/ui/Button";'
          import_line = 'import { SuspensionReportActions } from "../components/ui/SuspensionReportActions";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Button import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          map_anchor = '''                    {selectedAlunoOccurrencesSorted.map((occ, idx) => {
                      const ehSuspensao = occ.categoria === "suspensao";'''
          map_replacement = '''                    {selectedAlunoOccurrencesSorted.map((occ, idx) => {
                      const ehSuspensao = occ.categoria === "suspensao";
                      const origemSuspensao =
                        ehSuspensao && occ.ocorrencia_origem_id
                          ? selectedAlunoOccurrences.find(
                              (item) => String(item.id) === String(occ.ocorrencia_origem_id),
                            )
                          : null;
                      const ocorrenciasAteLimite = origemSuspensao
                        ? selectedAlunoOccurrences.filter(
                            (item) =>
                              item.categoria === "ocorrencia" &&
                              (item.data_ocorrido || "") <= (origemSuspensao.data_ocorrido || ""),
                          ).length
                        : 3;'''
          if 'const origemSuspensao =' not in text:
              if map_anchor not in text:
                  raise SystemExit('Occurrence map anchor not found')
              text = text.replace(map_anchor, map_replacement, 1)

          actions_anchor = '''                          <div className="flex justify-end gap-2 pt-1 border-t border-slate-100 dark:border-slate-700">
                            <Button'''
          actions_replacement = '''                          {ehSuspensao && (
                            <SuspensionReportActions
                              suspension={occ}
                              aluno={selectedAluno}
                              turmaName={turmas.find((t) => t.id === selectedAluno.turma_id)?.nome || "—"}
                              originOccurrence={origemSuspensao}
                              ocorrenciasAteLimite={ocorrenciasAteLimite}
                              numeroSuspensao={occ.suspensaoGerada?.numero || 1}
                            />
                          )}

                          <div className="flex justify-end gap-2 pt-1 border-t border-slate-100 dark:border-slate-700">
                            <Button'''
          if '<SuspensionReportActions' not in text:
              if actions_anchor not in text:
                  raise SystemExit('Actions anchor not found')
              text = text.replace(actions_anchor, actions_replacement, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Occurrences.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add suspension report actions to warnings"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-suspension-report-actions.yml || true
          git commit -m "chore: remove one-time suspension report workflow" || true
          git push || true
