name: Fix PDT duplicates v3
on:
  push:
    branches: [agent/fix-horarios-core]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact Etapa 6 block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Horarios.jsx')
          s = p.read_text(encoding='utf-8')

          helper_marker = "  const professorAssignmentGroups = useMemo(() => {"
          if 'const pdtOptionsForTurma = (turmaId) =>' not in s:
              insert_at = s.index(helper_marker)
              helper = '''  const pdtOptionsForTurma = (turmaId) => {
              const currentProfessorId = currentConfig.pdt?.[turmaId];
              const assignedElsewhere = new Set(
                Object.entries(currentConfig.pdt || {})
                  .filter(([otherTurmaId]) => String(otherTurmaId) !== String(turmaId))
                  .map(([, professorId]) => String(professorId)),
              );
              return professorOptions.filter((option) =>
                String(option.value) === String(currentProfessorId) || !assignedElsewhere.has(String(option.value)),
              );
            };

          '''
              s = s[:insert_at] + helper + s[insert_at:]

          start = s.index('{currentStep === 6 && (')
          end = s.index('\n        )}', start)
          block = s[start:end]
          old = 'options={professorOptions}'
          if old not in block:
              raise SystemExit('options={professorOptions} not found inside Etapa 6')
          block = block.replace(old, 'options={pdtOptionsForTurma(turmaId)}', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup workflows
        run: |
          rm -f .github/workflows/fix-pdt-duplicates.yml .github/workflows/fix-pdt-duplicates-v2.yml .github/workflows/fix-pdt-duplicates-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx .github/workflows/fix-pdt-duplicates.yml .github/workflows/fix-pdt-duplicates-v2.yml .github/workflows/fix-pdt-duplicates-v3.yml
          git commit -m "fix(horarios): prevent duplicate PDT assignments"
          git push origin HEAD:agent/fix-horarios-core
