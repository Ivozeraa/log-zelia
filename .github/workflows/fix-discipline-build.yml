name: Fix discipline build patch

on:
  push:
    paths:
      - '.github/workflows/fix-discipline-build.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix popup patch marker
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('scripts/apply-discipline-refinement.cjs')
          text = path.read_text(encoding='utf-8')
          old = "const marker = '      </Modal>\\n    </div>,\\n    document.body,\\n  );\\n}';"
          new = "const marker = '      </Modal>\\n  );\\n}';"
          if old not in text:
              raise SystemExit('Marker esperado não encontrado.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          wf = Path('.github/workflows/fix-discipline-build.yml')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','scripts/apply-discipline-refinement.cjs'], check=True)
          wf.unlink(missing_ok=True)
          subprocess.run(['git','add','-u','.github/workflows/fix-discipline-build.yml'], check=True)
          subprocess.run(['git','commit','-m','fix: corrigir marcador do patch disciplinar'], check=True)
          subprocess.run(['git','push'], check=True)
