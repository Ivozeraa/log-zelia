name: Refine disciplinary flow

on:
  push:
    paths:
      - '.github/workflows/update-suspension-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply disciplinary flow refinements
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          # 1) Replace the suspension popup with a consistent system-font UI,
          #    richer copy/share content and an explicit third-suspension/expulsion modal.
          popup = Path('src/components/ui/SuspensionDecisionPopup.jsx')
          popup.write_text(r'''import { useEffect, useMemo, useState } from "react";
import {
  FaCalendarAlt,
  FaCopy,
  FaDownload,
  FaExclamationTriangle,
  FaShareAlt,
} from "react-icons/fa";
import logoLogin from "../../assets/images/logo-login.png";
import topoMini from "../../assets/images/topo_mini.png";
import { Modal } from "./Modal";

const formatDate = (value) => {
  if (!value) return "—";
  const [year, month, day] = String(value).slice(0, 10).split("-");
  return year && month && day ? `${day}/${month}/${year}` : String(value);
};

const today = () => new Date().toISOString().slice(0, 10);

const addDays = (value, amount) => {
  if (!value || Number(amount) < 1) return "";
  const date = new Date(`${value}T12:00:00`);
  date.setDate(date.getDate() + Number(amount) - 1);
  return date.toISOString().slice(0, 10);
};

const loadImage = (src) =>
  new Promise((resolve) => {
    const image = new Image();
    image.crossOrigin = "anonymous";
    image.onload = () => resolve(image);
    image.onerror = () => resolve(null);
    image.src = src;
  });

export function SuspensionDecisionPopup({ items = [], onConfirm, onDismiss }) {
  const pending = items[0] || null;
  const [days, setDays] = useState(1);
  const [startDate, setStartDate] = useState(today());
  const [saving, setSaving] = useState(false);
  const [sharing, setSharing] = useState(false);
  const [notice, setNotice] = useState("");
  const [expulsionNotice, setExpulsionNotice] = useState(null);

  useEffect(() => {
    if (!pending) return;
    if (pending.alreadyApplied && Number(pending.suspensoes || 0) + 1 >= 3) {
      setExpulsionNotice({
        pending,
        days: pending.days || 1,
        startDate: pending.startDate || today(),
        endDate: pending.endDate || addDays(pending.startDate || today(), pending.days || 1),
      });
      return;
    }
    setExpulsionNotice(null);
    setDays(1);
    setStartDate(today());
    setNotice("");
  }, [pending?.occurrence?.id, pending?.alreadyApplied]);

  const endDate = useMemo(() => addDays(startDate, days), [startDate, days]);
  const numeroSuspensao = Number(pending?.suspensoes || 0) + 1;
  const ocorrenciasAteLimite = Number(pending?.ocorrenciasAteLimite || numeroSuspensao * 3);
  const totalPendentes = items.length;
  const professorResponsavel = pending?.occurrence?.professor_nome || "Não informado";
  const resultadoExpulsao = numeroSuspensao >= 3;

  const textoCompartilhamento = pending
    ? `${resultadoExpulsao ? "🚨 COMUNICADO DE EXPULSÃO" : "🚨 COMUNICADO DE SUSPENSÃO"}\n\n👤 Aluno: ${pending.aluno?.nome || "Aluno"}\n🏫 Turma: ${pending.turma?.nome || "—"}\n⚠️ Suspensão: ${numeroSuspensao}ª${resultadoExpulsao ? " (3ª e última suspensão)" : ""}\n⏳ Duração: ${days} ${Number(days) === 1 ? "dia" : "dias"}\n📅 Período: ${formatDate(startDate)} até ${formatDate(endDate)}\n📝 Motivo: ${resultadoExpulsao ? "O aluno atingiu a 3ª suspensão, resultando em expulsão." : `O aluno atingiu ${ocorrenciasAteLimite} ocorrências.`}\n📌 Ocorrência que acionou a medida: ${pending.occurrence?.descricao || "Não informado"}\n👨‍🏫 Professor responsável: ${professorResponsavel}\n\nRegistro realizado pelo LogZélia – Sistema de Gestão Escolar.`
    : "";

  const createImageBlob = async (isExpulsion = false, imageDetails = {}) => {
    if (!pending) return null;
    const currentDays = imageDetails.days ?? days;
    const currentStart = imageDetails.startDate ?? startDate;
    const currentEnd = imageDetails.endDate ?? endDate;
    const currentNumber = numeroSuspensao;
    const canvas = document.createElement("canvas");
    canvas.width = 1400;
    canvas.height = 1060;
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;

    const systemFont = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const gradient = ctx.createLinearGradient(0, 0, 1400, 270);
    gradient.addColorStop(0, isExpulsion ? "#991b1b" : "#166534");
    gradient.addColorStop(1, isExpulsion ? "#dc2626" : "#0f766e");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, 270);

    const logo = await loadImage(logoLogin);
    if (logo?.naturalWidth) ctx.drawImage(logo, 72, 54, 160, 160);

    ctx.fillStyle = "#fff";
    ctx.font = `700 48px ${systemFont}`;
    ctx.fillText("LogZélia", 270, 112);
    ctx.font = `600 25px ${systemFont}`;
    ctx.fillText(isExpulsion ? "COMUNICADO DE EXPULSÃO" : "COMUNICADO DE SUSPENSÃO", 270, 160);

    ctx.fillStyle = "#0f172a";
    ctx.font = `600 24px ${systemFont}`;
    ctx.fillText("Aluno", 90, 330);
    ctx.font = `700 36px ${systemFont}`;
    ctx.fillText(pending.aluno?.nome || "Aluno", 90, 375);
    ctx.font = `500 21px ${systemFont}`;
    if (pending.aluno?.matricula) ctx.fillText(`Matrícula: ${pending.aluno.matricula}`, 90, 410);

    ctx.font = `600 24px ${systemFont}`;
    ctx.fillText("Turma", 90, 465);
    ctx.font = `600 30px ${systemFont}`;
    ctx.fillText(pending.turma?.nome || "—", 90, 505);

    ctx.fillStyle = isExpulsion ? "#b91c1c" : "#b45309";
    ctx.font = `600 24px ${systemFont}`;
    ctx.fillText(isExpulsion ? "Expulsão" : "Suspensão", 90, 585);
    ctx.fillStyle = "#0f172a";
    ctx.font = `700 33px ${systemFont}`;
    ctx.fillText(isExpulsion ? "3ª suspensão — expulsão" : `${currentNumber}ª suspensão`, 90, 630);

    ctx.font = `600 24px ${systemFont}`;
    ctx.fillText("Duração", 760, 585);
    ctx.font = `700 33px ${systemFont}`;
    ctx.fillText(`${currentDays} ${Number(currentDays) === 1 ? "dia" : "dias"}`, 760, 630);
    ctx.font = `500 22px ${systemFont}`;
    ctx.fillText(`${formatDate(currentStart)} até ${formatDate(currentEnd)}`, 760, 670);

    ctx.fillStyle = "#334155";
    ctx.font = `600 23px ${systemFont}`;
    ctx.fillText("Motivo", 90, 730);
    ctx.font = `500 21px ${systemFont}`;
    const reason = isExpulsion
      ? "O aluno atingiu a 3ª suspensão, resultando em expulsão."
      : `O aluno atingiu ${ocorrenciasAteLimite} ocorrências.`;
    ctx.fillText(reason, 90, 765);

    ctx.font = `600 23px ${systemFont}`;
    ctx.fillText("Ocorrência que acionou a medida", 90, 815);
    ctx.font = `500 20px ${systemFont}`;
    const description = pending.occurrence?.descricao || "Não informado";
    const words = description.split(/\\s+/);
    let line = "";
    let y = 850;
    for (const word of words) {
      const test = line ? `${line} ${word}` : word;
      if (ctx.measureText(test).width > 1220) {
        ctx.fillText(line, 90, y);
        line = word;
        y += 28;
      } else line = test;
      if (y > 900) break;
    }
    if (line) ctx.fillText(line, 90, y);

    ctx.font = `500 18px ${systemFont}`;
    ctx.fillStyle = "#64748b";
    ctx.fillText(`Professor responsável: ${professorResponsavel}`, 90, 930);

    const footer = await loadImage(topoMini);
    if (footer?.naturalWidth) {
      ctx.drawImage(footer, 0, 970, 1400, 90);
    }

    return new Promise((resolve) => canvas.toBlob(resolve, "image/png", 0.95));
  };

  const copyText = async (text = textoCompartilhamento) => {
    await navigator.clipboard?.writeText(text);
    setNotice("Comunicado copiado para a área de transferência.");
  };

  const downloadImage = async (isExpulsion = false, imageDetails = {}) => {
    setSharing(true);
    try {
      const blob = await createImageBlob(isExpulsion, imageDetails);
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `${isExpulsion ? "expulsao" : "suspensao"}-${(pending?.aluno?.nome || "aluno").replace(/\\s+/g, "-").toLowerCase()}.png`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    } finally {
      setSharing(false);
    }
  };

  const shareImage = async (isExpulsion = false, imageDetails = {}) => {
    setSharing(true);
    try {
      const text = isExpulsion
        ? `🚨 COMUNICADO DE EXPULSÃO\n\n👤 Aluno: ${pending.aluno?.nome || "Aluno"}\n🏫 Turma: ${pending.turma?.nome || "—"}\n🚫 Medida: 3ª suspensão — expulsão\n⏳ Duração: ${imageDetails.days ?? days} ${(imageDetails.days ?? days) === 1 ? "dia" : "dias"}\n📅 Período: ${formatDate(imageDetails.startDate ?? startDate)} até ${formatDate(imageDetails.endDate ?? endDate)}\n📝 Motivo: O aluno atingiu a 3ª suspensão, resultando em expulsão.\n📌 Ocorrência: ${pending.occurrence?.descricao || "Não informado"}\n👨‍🏫 Professor responsável: ${professorResponsavel}\n\nRegistro realizado pelo LogZélia – Sistema de Gestão Escolar.`
        : textoCompartilhamento;
      const blob = await createImageBlob(isExpulsion, imageDetails);
      if (!blob) return;
      const file = new File([blob], `${isExpulsion ? "expulsao" : "suspensao"}.png`, { type: "image/png" });
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        await navigator.share({ title: isExpulsion ? "Comunicado de Expulsão" : "Comunicado de Suspensão", text, files: [file] });
      } else {
        await navigator.clipboard?.writeText(text);
        setNotice("Seu dispositivo não permite compartilhar a imagem. O texto foi copiado.");
      }
    } catch (error) {
      if (error?.name !== "AbortError") setNotice("Não foi possível compartilhar agora.");
    } finally {
      setSharing(false);
    }
  };

  const handleConfirm = async () => {
    if (!pending || Number(days) < 1 || !startDate || !endDate || saving) return;
    setSaving(true);
    setNotice("");
    try {
      await onConfirm?.(pending, { days: Number(days), startDate, endDate });
      if (numeroSuspensao >= 3) {
        setExpulsionNotice({ pending, days: Number(days), startDate, endDate });
      } else {
        onDismiss?.(pending.occurrence.id);
      }
    } catch (error) {
      console.error(error);
      setNotice("Não foi possível registrar a suspensão.");
    } finally {
      setSaving(false);
    }
  };

  const closeExpulsion = () => {
    const id = expulsionNotice?.pending?.occurrence?.id;
    setExpulsionNotice(null);
    if (id) onDismiss?.(id);
  };

  if (!pending) return null;

  const expulsionData = expulsionNotice || (pending.alreadyApplied ? {
    pending,
    days: pending.days || 1,
    startDate: pending.startDate || today(),
    endDate: pending.endDate || addDays(pending.startDate || today(), pending.days || 1),
  } : null);

  const renderStudentData = (compact = false) => (
    <div className={`grid gap-3 ${compact ? "sm:grid-cols-2" : "sm:grid-cols-2"}`}>
      <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-900">
        <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Aluno</p>
        <p className="mt-1 text-lg font-bold leading-snug text-slate-900 dark:text-white">{pending.aluno?.nome || "—"}</p>
        {pending.aluno?.matricula && <p className="mt-1 text-xs text-slate-500">Matrícula: {pending.aluno.matricula}</p>}
      </div>
      <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-900">
        <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Turma</p>
        <p className="mt-1 text-lg font-bold text-slate-900 dark:text-white">{pending.turma?.nome || "—"}</p>
      </div>
    </div>
  );

  return (
    <div className="font-sans">
      <Modal
        isOpen={Boolean(pending) && !expulsionData}
        onClose={() => onDismiss?.(null)}
        title="Decisão de suspensão"
      >
        <div className="space-y-5 font-sans">
          <div className="flex flex-col gap-3 rounded-2xl border border-amber-200 bg-gradient-to-r from-amber-50 to-red-50 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
            <div className="flex items-center gap-3">
              <div className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-amber-100 text-amber-700"><FaExclamationTriangle /></div>
              <div>
                <p className="text-xs font-semibold uppercase tracking-[0.14em] text-amber-700">Ação necessária</p>
                <p className="text-base font-bold text-slate-900">Este aluno será suspenso</p>
                <p className="text-xs text-slate-500">Informe a duração antes de concluir.</p>
              </div>
            </div>
            {totalPendentes > 1 && <span className="w-fit rounded-full bg-white px-3 py-1 text-xs font-semibold text-slate-600 shadow-sm">{totalPendentes} pendentes</span>}
          </div>

          {renderStudentData()}

          <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <p className="text-sm font-semibold text-amber-900">Ocorrência que acionou a suspensão</p>
              <span className="rounded-full bg-amber-200 px-3 py-1 text-xs font-semibold text-amber-900">{formatDate(pending.occurrence?.data_ocorrido)}</span>
            </div>
            <p className="mt-2 text-sm leading-6 text-amber-800">{pending.occurrence?.descricao || "Descrição não informada."}</p>
            <p className="mt-2 text-xs font-medium text-amber-700">Situação: {pending.occurrence?.tipo || "Ocorrência"}</p>
          </div>

          <div className="rounded-2xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
            <p className="text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">Suspensão</p>
            <p className="mt-1 text-xl font-bold text-slate-900 dark:text-white">{numeroSuspensao}ª suspensão</p>
          </div>

          <div className="grid gap-4 sm:grid-cols-2">
            <label className="block">
              <span className="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-300">Duração da suspensão</span>
              <div className="relative"><FaCalendarAlt className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" /><input type="number" min="1" step="1" inputMode="numeric" value={days} onChange={(event) => setDays(Math.max(1, Number(event.target.value) || 1))} className="w-full rounded-xl border border-slate-300 bg-white py-3 pl-10 pr-4 font-medium outline-none transition focus:border-green-600 focus:ring-2 focus:ring-green-100 dark:border-slate-700 dark:bg-slate-950 dark:text-white" /></div>
              <span className="mt-1 block text-xs text-slate-500">O professor define quantos dias o aluno ficará suspenso.</span>
            </label>
            <label className="block">
              <span className="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-300">Início</span>
              <input type="date" value={startDate} onChange={(event) => setStartDate(event.target.value)} className="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 font-medium outline-none transition focus:border-green-600 focus:ring-2 focus:ring-green-100 dark:border-slate-700 dark:bg-slate-950 dark:text-white" />
              <span className="mt-1 block text-xs text-slate-500">Término calculado: <strong>{formatDate(endDate)}</strong></span>
            </label>
          </div>

          {notice && <p className="rounded-xl bg-slate-100 px-4 py-3 text-sm font-medium text-slate-700">{notice}</p>}

          <div className="flex flex-col gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:flex-wrap sm:justify-end">
            <button type="button" onClick={() => copyText()} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"><FaCopy /> Copiar texto</button>
            <button type="button" onClick={() => downloadImage(false)} disabled={sharing} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:opacity-50"><FaDownload /> Baixar imagem</button>
            <button type="button" onClick={() => shareImage(false)} disabled={sharing} className="inline-flex items-center justify-center gap-2 rounded-xl border border-green-200 bg-green-50 px-4 py-2.5 text-sm font-semibold text-green-800 transition hover:bg-green-100 disabled:opacity-50"><FaShareAlt /> Compartilhar</button>
          </div>

          <div className="flex flex-col gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:justify-end">
            <button type="button" onClick={() => onDismiss?.(null)} className="rounded-xl px-4 py-3 text-sm font-semibold text-slate-500 hover:bg-slate-100">Decidir depois</button>
            <button type="button" onClick={handleConfirm} disabled={saving} className="rounded-xl bg-green-700 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-green-700/20 transition hover:bg-green-800 disabled:opacity-50">{saving ? "Registrando..." : "Confirmar suspensão"}</button>
          </div>
        </div>
      </Modal>

      <Modal
        isOpen={Boolean(expulsionData)}
        onClose={closeExpulsion}
        title="Expulsão do aluno"
      >
        {expulsionData && (
          <div className="space-y-5 font-sans">
            <div className="rounded-2xl border border-red-200 bg-gradient-to-r from-red-50 to-rose-50 px-4 py-5">
              <div className="flex items-start gap-3">
                <div className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-red-100 text-red-700"><FaExclamationTriangle /></div>
                <div>
                  <p className="text-xs font-semibold uppercase tracking-[0.14em] text-red-700">Medida disciplinar final</p>
                  <h3 className="mt-1 text-xl font-bold text-red-900">O aluno será expulso</h3>
                  <p className="mt-1 text-sm leading-6 text-red-800">A 3ª suspensão foi registrada e, conforme a regra disciplinar configurada no sistema, ela resulta em expulsão.</p>
                </div>
              </div>
            </div>

            {renderStudentData(true)}

            <div className="rounded-2xl border border-red-200 bg-red-50 p-4">
              <p className="text-xs font-semibold uppercase tracking-wide text-red-600">Motivo da expulsão</p>
              <p className="mt-1 text-base font-semibold text-red-900">O aluno atingiu a 3ª suspensão.</p>
              <p className="mt-2 text-sm leading-6 text-red-800">Ocorrência relacionada: {pending.occurrence?.descricao || "Não informado"}</p>
              <p className="mt-2 text-xs font-medium text-red-700">Professor responsável: {professorResponsavel}</p>
            </div>

            <div className="grid gap-3 sm:grid-cols-2">
              <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Suspensão</p>
                <p className="mt-1 text-lg font-bold text-slate-900">3ª suspensão</p>
              </div>
              <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                <p className="text-xs font-semibold uppercase tracking-wide text-slate-400">Duração</p>
                <p className="mt-1 text-lg font-bold text-slate-900">{expulsionData.days} {Number(expulsionData.days) === 1 ? "dia" : "dias"}</p>
                <p className="mt-1 text-xs text-slate-500">{formatDate(expulsionData.startDate)} até {formatDate(expulsionData.endDate)}</p>
              </div>
            </div>

            <div className="flex flex-col gap-2 border-t border-slate-200 pt-4 sm:flex-row sm:flex-wrap sm:justify-end">
              <button type="button" onClick={() => copyText(`🚨 COMUNICADO DE EXPULSÃO\n\n👤 Aluno: ${pending.aluno?.nome || "Aluno"}\n🏫 Turma: ${pending.turma?.nome || "—"}\n🚫 Medida: 3ª suspensão — expulsão\n⏳ Duração: ${expulsionData.days} ${Number(expulsionData.days) === 1 ? "dia" : "dias"}\n📅 Período: ${formatDate(expulsionData.startDate)} até ${formatDate(expulsionData.endDate)}\n📝 Motivo: O aluno atingiu a 3ª suspensão, resultando em expulsão.\n📌 Ocorrência: ${pending.occurrence?.descricao || "Não informado"}\n👨‍🏫 Professor responsável: ${professorResponsavel}\n\nRegistro realizado pelo LogZélia – Sistema de Gestão Escolar.`)} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"><FaCopy /> Copiar texto</button>
              <button type="button" onClick={() => downloadImage(true, expulsionData)} disabled={sharing} className="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:opacity-50"><FaDownload /> Baixar imagem</button>
              <button type="button" onClick={() => shareImage(true, expulsionData)} disabled={sharing} className="inline-flex items-center justify-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-800 transition hover:bg-red-100 disabled:opacity-50"><FaShareAlt /> Compartilhar</button>
            </div>

            <div className="flex justify-end border-t border-slate-200 pt-4">
              <button type="button" onClick={closeExpulsion} className="rounded-xl bg-red-700 px-5 py-3 text-sm font-bold text-white transition hover:bg-red-800">Concluir</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}
''', encoding='utf-8')

          # 2) History must count/display only real suspension rows and hide the occurrence
          #    that is referenced as its origin, while retaining the reason and teacher.
          history = Path('src/pages/Occurrences.jsx')
          text = history.read_text(encoding='utf-8')
          text = re.sub(
              r'const contarSuspensoes = \(ocorrenciasDoAluno\) => \{.*?\n\};',
              '''const contarSuspensoes = (ocorrenciasDoAluno) => {
  if (!ocorrenciasDoAluno || ocorrenciasDoAluno.length === 0) return 0;
  return ocorrenciasDoAluno.filter((item) => item.categoria === "suspensao").length;
};''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'const ordenarESinalizarSuspensoes = \(lista\) => \{.*?\n\};',
              '''const ordenarESinalizarSuspensoes = (lista) => {
  const ascendente = [...lista].sort((a, b) =>
    (a.data_ocorrido || "").localeCompare(b.data_ocorrido || ""),
  );
  const origemDasSuspensoes = new Set(
    ascendente
      .filter((item) => item.categoria === "suspensao" && item.ocorrencia_origem_id)
      .map((item) => item.ocorrencia_origem_id),
  );
  let numeroSuspensao = 0;
  const suspensoes = ascendente
