name: Apply select positioning fix

on:
  push:
    branches:
      - agent/fix-horarios-core

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-horarios-core

      - name: Apply targeted fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/ui/CustomSelect.jsx')
          text = path.read_text(encoding='utf-8')
          old = '''      const openAbove = spaceBelow < estimatedContentHeight && spaceAbove > spaceBelow;\n      const maxHeight = Math.max(\n        120,\n        Math.min(380, openAbove ? spaceAbove : Math.max(spaceBelow, 120)),\n      );\n      const top = openAbove\n        ? Math.max(viewportPadding, rect.top - maxHeight - gap)\n        : rect.bottom + gap;'''
          new = '''      const minimumSpaceBelow = 120;\n      const canOpenBelow = spaceBelow >= minimumSpaceBelow;\n      const openAbove = !canOpenBelow && spaceAbove > spaceBelow;\n      const maxHeight = openAbove\n        ? Math.max(120, Math.min(380, spaceAbove))\n        : Math.max(120, Math.min(380, spaceBelow));\n      const top = openAbove\n        ? Math.max(viewportPadding, rect.top - maxHeight - gap)\n        : rect.bottom + gap;'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-select-position.yml
          git add src/components/ui/CustomSelect.jsx .github/workflows/fix-select-position.yml
          git commit -m "fix(ui): keep select options below trigger when possible" || exit 0
          git push origin agent/fix-horarios-core