name: Remove assignment block curriculum restriction
on:
  push:
    branches: [agent/fix-horarios-core]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(horarios): allow mixed-class assignment blocks') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/remove-block-curriculum-restriction.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx
          git rm -f scripts/remove-block-curriculum-restriction.py .github/workflows/remove-block-curriculum-restriction.yml
          git commit -m "fix(horarios): allow mixed-class assignment blocks"
          git push origin agent/fix-horarios-core
