name: Simplify curriculum assignments v2

on:
  push:
    branches: [agent/fix-horarios-core]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0

      - name: Apply prepared patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          wf = Path('.github/workflows/simplify-curriculum-assignments.yml').read_text(encoding='utf-8')
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          start = wf.find(marker_start)
          end = wf.find(marker_end, start + len(marker_start))
          if start == -1 or end == -1:
              raise SystemExit('Prepared patch block not found')
          code = dedent(wf[start + len(marker_start):end])
          exec(code, {})
          PY

      - name: Validate and publish
        shell: bash
        run: |
          npm ci
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx .github/workflows/simplify-curriculum-assignments-v2.yml
          git commit -m "feat(horarios): simplify curriculum assignments"
          git push origin agent/fix-horarios-core
