name: Fix step 4 multi-select and autosave
on:
  push:
    branches: [agent/fix-horarios-core]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CustomSelect and Horarios
        run: |
          python - <<'PY'
          from pathlib import Path
          
          p = Path('src/components/ui/CustomSelect.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  multiple = false,\n}) => {', '  multiple = false,\n  showSelectedValues = true,\n}) => {', 1)
          old = '{multiple && selectedValues && selectedValues.length > 0 && ('
          new = '{multiple && showSelectedValues && selectedValues && selectedValues.length > 0 && ('
          if old not in s:
              raise SystemExit('CustomSelect selected-values block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/pages/Horarios.jsx')
          s = p.read_text(encoding='utf-8')
          old = 'options={turmaOptions.filter((option) => currentConfig.turmas.includes(String(option.value)))} placeholder="Selecione uma ou mais turmas" emptyLabel="Selecione turmas na Etapa 2" showSearch />'
          new = 'options={turmaOptions.filter((option) => currentConfig.turmas.includes(String(option.value)))} placeholder="Selecione uma ou mais turmas" emptyLabel="Selecione turmas na Etapa 2" showSearch showSelectedValues={false} />'
          if old not in s:
              raise SystemExit('Step 4 turma select not found')
          s = s.replace(old, new, 1)

          old_start = '  const nextStep = async () => {\n'
          start = s.index(old_start)
          end = s.index('\n  const previousStep = () =>', start)
          new_next = '''  const nextStep = async () => {
    if (currentStep === 1 && !currentConfig.nome.trim()) return notify.error('Informe o nome da configuração.');
    if (currentStep === 1 && !currentConfig.escola_id) return notify.error('Selecione a escola.');
    if (currentStep === 2 && !currentConfig.turmas.length) return notify.error('Selecione ao menos uma turma.');
    if (currentStep === 3 && currentConfig.professores.some((professor) => !byId(currentConfig.areas, professor.area_id))) return notify.error('Todos os professores precisam de uma área válida.');
    if (currentStep === 3 && !currentConfig.disciplinas.length) return notify.error('Cadastre pelo menos uma disciplina antes de avançar.');
    if (currentStep === 4) {
      const invalid = validateConfig(false);
      if (invalid.length) return notify.error(invalid[0].mensagem);
    }
    if (currentStep === 6) {
      const invalid = validateConfig(true);
      if (invalid.length) return notify.error(invalid[0].mensagem);
    }
    if (currentStep < 7) {
      const saved = await saveConfiguration(false);
      if (!saved) return;
    }
    setCurrentStep((step) => Math.min(7, step + 1));
  };
'''
          s = s[:start] + new_next + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-step4-autosave.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/CustomSelect.jsx src/pages/Horarios.jsx .github/workflows/fix-step4-autosave.yml
          git commit -m "feat(horarios): autosave between steps and hide selected turma chips"
          git push origin HEAD:agent/fix-horarios-core
