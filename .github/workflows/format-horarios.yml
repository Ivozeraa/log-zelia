name: Format Horarios

on:
  push:
    branches:
      - agent/fix-horarios-core
    paths:
      - src/pages/Horarios.jsx

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format Horarios.jsx
        run: npx --yes prettier@3.6.2 --write src/pages/Horarios.jsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx
          git diff --cached --quiet || git commit -m "style(horarios): format Horarios.jsx"
          git push origin HEAD:${GITHUB_REF_NAME}
