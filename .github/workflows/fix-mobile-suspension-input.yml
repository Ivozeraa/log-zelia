name: Fix mobile suspension input

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-suspension-input.yml'
      - 'src/components/ui/SuspensionDecisionPopup.jsx'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix empty number input state
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/ui/SuspensionDecisionPopup.jsx')
          text = path.read_text(encoding='utf-8')

          old = 'onChange={(e) => setDays(Math.max(1, Number(e.target.value) || 1))}'
          new = 'onChange={(e) => setDays(e.target.value === "" ? "" : Math.max(1, Number(e.target.value) || 1))}'

          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          else:
              print('Input handler already corrected or source changed; no replacement needed.')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/SuspensionDecisionPopup.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: permitir apagar duração da suspensão no mobile"
            git push
          fi
