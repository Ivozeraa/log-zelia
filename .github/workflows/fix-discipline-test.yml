name: Fix discipline marker test

on:
  push:
    paths:
      - '.github/workflows/fix-discipline-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix regex test
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('scripts/apply-discipline-refinement.cjs')
          t = p.read_text(encoding='utf-8')
          old = "    if (!text.includes(marker)) throw new Error('Fim do popup não encontrado.');"
          new = "    if (!marker.test(text)) throw new Error('Fim do popup não encontrado.');"
          if old not in t:
              raise SystemExit('includes line not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          wf = Path('.github/workflows/fix-discipline-test.yml')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','scripts/apply-discipline-refinement.cjs'],check=True)
          wf.unlink(missing_ok=True)
          subprocess.run(['git','add','-u','.github/workflows/fix-discipline-test.yml'],check=True)
          subprocess.run(['git','commit','-m','fix: usar test no marcador disciplinar'],check=True)
          subprocess.run(['git','push'],check=True)
