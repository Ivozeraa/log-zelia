name: Apply disciplinary history fix

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch history and third suspension flow
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          history = Path('src/pages/Occurrences.jsx')
          text = history.read_text(encoding='utf-8')
          text = re.sub(
              r'const contarSuspensoes = \(ocorrenciasDoAluno\) => \{.*?\n\};',
              '''const contarSuspensoes = (ocorrenciasDoAluno) => {
  if (!ocorrenciasDoAluno || ocorrenciasDoAluno.length === 0) return 0;
  return ocorrenciasDoAluno.filter((item) => item.categoria === "suspensao").length;
};''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'const ordenarESinalizarSuspensoes = \(lista\) => \{.*?\n\};',
              '''const ordenarESinalizarSuspensoes = (lista) => {
  const ascendente = [...lista].sort((a, b) => (a.data_ocorrido || "").localeCompare(b.data_ocorrido || ""));
  const origemIds = new Set(
    ascendente
      .filter((item) => item.categoria === "suspensao" && item.ocorrencia_origem_id)
      .map((item) => item.ocorrencia_origem_id),
  );
  let numeroSuspensao = 0;
  return ascendente
    .filter((item) => !(item.categoria === "ocorrencia" && origemIds.has(item.id)))
    .map((item) => {
      if (item.categoria !== "suspensao") return { ...item, suspensaoGerada: null };
      numeroSuspensao += 1;
      const origem = item.ocorrencia_origem_id
        ? ascendente.find((row) => row.id === item.ocorrencia_origem_id)
        : null;
      const totalOcorrencias = origem
        ? ascendente.filter((row) => row.categoria === "ocorrencia" && (row.data_ocorrido || "") <= (origem.data_ocorrido || "")).length
        : numeroSuspensao * 3;
      return {
        ...item,
        descricao: origem
          ? `O aluno atingiu ${totalOcorrencias} ocorrências. Motivo do professor: ${origem.descricao || "Não informado"}.`
          : (item.descricao || "Suspensão registrada."),
        suspensaoGerada: { numero: numeroSuspensao, origem: "aplicada" },
      };
    })
    .sort((a, b) => (b.data_ocorrido || "").localeCompare(a.data_ocorrido || ""));
};''',
              text,
              count=1,
              flags=re.S,
          )
          history.write_text(text, encoding='utf-8')

          home = Path('src/pages/Home.jsx')
          text = home.read_text(encoding='utf-8')
          text = text.replace('            suspensoes: totalSuspensoes,\n          });', '            suspensoes: totalSuspensoes,\n            ocorrenciasAteLimite: totalDepois,\n          });', 1)
          home.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/apply-history-fix.yml')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src/pages/Occurrences.jsx','src/pages/Home.jsx'],check=True)
          if wf.exists():
              wf.unlink()
              subprocess.run(['git','add','-u','.github/workflows/apply-history-fix.yml'],check=True)
          subprocess.run(['git','commit','-m','fix: ocultar ocorrencia origem no historico'],check=True)
          subprocess.run(['git','push'],check=True)
