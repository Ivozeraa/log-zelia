name: Apply Management PDT Fix

on:
  push:
    branches:
      - agent/fix-horarios-core

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Management
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Management.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''      const { error } = await supabase\n        .from("usuarios")\n        .update({\n          nome: editForm.nome,\n          email: editForm.email,\n          role_id: Number(editForm.role_id),\n          escola_id: editForm.escola_id || null,\n          pdt: editForm.pdt,\n        })\n        .eq("id", editForm.id);\n\n      if (error) {\n        notify.error("Erro ao atualizar usuário.");\n        return;\n      }\n\n      setUsers((prev) =>\n        prev.map((u) =>\n          u.id === editForm.id\n            ? {\n              ...u,\n              ...editForm,\n              role_id: Number(editForm.role_id),\n            }\n            : u,\n        ),\n      );\n'''
          new = '''      const { data: updatedUser, error } = await supabase\n        .from("usuarios")\n        .update({\n          nome: editForm.nome,\n          email: editForm.email,\n          role_id: Number(editForm.role_id),\n          escola_id: editForm.escola_id || null,\n          pdt: Boolean(editForm.pdt),\n        })\n        .eq("id", editForm.id)\n        .select("id, nome, email, role_id, escola_id, pdt, created_at")\n        .maybeSingle();\n\n      if (error) {\n        console.error("Erro ao atualizar usuário:", error);\n        notify.error(error.message || "Erro ao atualizar usuário.");\n        return;\n      }\n\n      if (!updatedUser) {\n        notify.error("Nenhum usuário foi atualizado. Verifique suas permissões.");\n        return;\n      }\n\n      setUsers((prev) =>\n        prev.map((u) =>\n          u.id === editForm.id ? updatedUser : u,\n        ),\n      );\n'''
          if old not in s:
              raise SystemExit('Management update block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm ci
          npm run build

      - name: Commit change and remove workflow
        run: |
          rm -f .github/workflows/fix-management-pdt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Management.jsx .github/workflows/fix-management-pdt.yml
          git commit -m "fix(management): persist user pdt updates"
          git push origin HEAD:agent/fix-horarios-core
