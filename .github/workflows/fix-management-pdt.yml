name: Fix Management PDT

on:
  push:
    branches: [agent/fix-horarios-core]

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'automate management pdt fix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Management update flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/Management.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''      const { error } = await supabase
        .from("usuarios")
        .update({
          nome: editForm.nome,
          email: editForm.email,
          role_id: Number(editForm.role_id),
          escola_id: editForm.escola_id || null,
          pdt: editForm.pdt,
        })
        .eq("id", editForm.id);

      if (error) {
        notify.error("Erro ao atualizar usuário.");
        return;
      }

      setUsers((prev) =>
        prev.map((u) =>
          u.id === editForm.id
            ? {
              ...u,
              ...editForm,
              role_id: Number(editForm.role_id),
            }
            : u,
        ),
      );
'''
          new = '''      const { data: updatedUser, error } = await supabase
        .from("usuarios")
        .update({
          nome: editForm.nome,
          email: editForm.email,
          role_id: Number(editForm.role_id),
          escola_id: editForm.escola_id || null,
          pdt: Boolean(editForm.pdt),
        })
        .eq("id", editForm.id)
        .select("id, nome, email, role_id, escola_id, pdt, created_at")
        .maybeSingle();

      if (error) {
        console.error("Erro ao atualizar usuário:", error);
        notify.error(error.message || "Erro ao atualizar usuário.");
        return;
      }

      if (!updatedUser) {
        notify.error("Nenhum usuário foi atualizado. Verifique suas permissões.");
        return;
      }

      setUsers((prev) =>
        prev.map((u) =>
          u.id === editForm.id ? updatedUser : u,
        ),
      );
'''
          if old not in s:
              raise SystemExit('Trecho esperado de handleEditUser não encontrado')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Cleanup workflow and commit
        run: |
          rm -f .github/workflows/fix-management-pdt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Management.jsx .github/workflows/fix-management-pdt.yml
          git commit -m "fix(management): persist user pdt updates" || exit 0
          git push origin agent/fix-horarios-core
