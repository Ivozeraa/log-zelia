name: Style assignment selects
on:
  push:
    branches: [agent/fix-horarios-core]
    paths:
      - 'scripts/style-assignment-selects.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0
      - name: Apply layout
        run: python3 scripts/style-assignment-selects.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Horarios.jsx
          git commit -m 'fix(horarios): align assignment selects in grid' || true
          git push origin agent/fix-horarios-core
          git rm -f scripts/style-assignment-selects.py .github/workflows/style-assignment-selects.yml || true
          git commit -m 'chore: remove temporary select layout workflow' || true
          git push origin agent/fix-horarios-core
