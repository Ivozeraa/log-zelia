name: Fix select and common subjects

on:
  push:
    branches: [agent/fix-horarios-core]
    paths:
      - scripts/fix_select_and_common_subjects.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0

      - name: Apply targeted fix
        run: python3 scripts/fix_select_and_common_subjects.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx src/components/ui/CustomSelect.jsx
          git rm -f scripts/fix_select_and_common_subjects.py .github/workflows/fix-select-common-subjects.yml
          git commit -m "fix(ui): align selects and general subjects"
          git push origin agent/fix-horarios-core
