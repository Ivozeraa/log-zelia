name: Performance changes validation

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "vite.config.js"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/performance-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production bundle
        run: npm run build
