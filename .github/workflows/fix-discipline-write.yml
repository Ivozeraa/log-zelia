name: Fix discipline patch write

on:
  push:
    paths:
      - '.github/workflows/fix-discipline-write.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix write call
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('scripts/apply-discipline-refinement.cjs')
          t = p.read_text(encoding='utf-8')
          old = '  popup.writeText(text, \'utf8\');'
          new = '  write(file, text);'
          if old not in t:
              raise SystemExit('write call not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          wf = Path('.github/workflows/fix-discipline-write.yml')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','scripts/apply-discipline-refinement.cjs'],check=True)
          wf.unlink(missing_ok=True)
          subprocess.run(['git','add','-u','.github/workflows/fix-discipline-write.yml'],check=True)
          subprocess.run(['git','commit','-m','fix: corrigir escrita do patch disciplinar'],check=True)
          subprocess.run(['git','push'],check=True)
