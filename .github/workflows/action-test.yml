name: Action test

on: push

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write marker
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          Path('ACTION_TEST_MARKER.txt').write_text('actions-ok\n')
          wf = Path('.github/workflows/action-test.yml')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','ACTION_TEST_MARKER.txt'],check=True)
          if wf.exists():
              wf.unlink()
              subprocess.run(['git','add','-u','.github/workflows/action-test.yml'],check=True)
          subprocess.run(['git','commit','-m','chore: verify actions execution'],check=True)
          subprocess.run(['git','push'],check=True)
