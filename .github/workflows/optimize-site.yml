name: Optimize site performance

on:
  push:
    branches:
      - agent/fix-horarios-core
    paths:
      - .github/workflows/optimize-site.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 1

      - name: Optimize Horarios imports
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/Horarios.jsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace("import { jsPDF } from 'jspdf';\nimport autoTable from 'jspdf-autotable';\nimport ExcelJS from 'exceljs';\n", "")

          marker = "const emptyGrade = { grid: {}, schedule: [], validation: [], unscheduled: [] };"
          helper = """const pdfLibrariesPromise = Promise.all([\n  import('jspdf'),\n  import('jspdf-autotable'),\n]).then(([jspdfModule, autoTableModule]) => ({\n  jsPDF: jspdfModule.jsPDF,\n  autoTable: autoTableModule.default,\n}));\n\nconst excelLibrariesPromise = import('exceljs').then((module) => module.default);\n\n"""
          if "const pdfLibrariesPromise = Promise.all([" not in text:
              text = text.replace(marker, helper + marker, 1)

          text = text.replace(
              "const renderTurmaTable = (doc, turmaId, startY, { compact = false } = {}) => {",
              "const renderTurmaTable = (doc, turmaId, startY, { compact = false, autoTable } = {}) => {",
              1,
          )

          text = text.replace("    autoTable(doc, {", "    if (!autoTable) throw new Error('Biblioteca PDF não carregada.');\n\n    autoTable(doc, {", 1)

          export_marker = "  const exportPdf = async ({ mode = 'separated', courseKey = '' } = {}) => {"
          if export_marker not in text:
              raise SystemExit('exportPdf marker not found')
          text = text.replace(
              export_marker,
              export_marker + "\n    const { jsPDF, autoTable } = await pdfLibrariesPromise;",
              1,
          )

          text = text.replace(
              "renderTurmaTable(doc, turmaId, cursorY, { compact: true })",
              "renderTurmaTable(doc, turmaId, cursorY, { compact: true, autoTable })",
          )
          text = text.replace(
              "renderTurmaTable(doc, turmaId, PDF_TOP_MARGIN)",
              "renderTurmaTable(doc, turmaId, PDF_TOP_MARGIN, { autoTable })",
          )

          excel_marker = "  const exportExcel = async () => {"
          if excel_marker not in text:
              raise SystemExit('exportExcel marker not found')
          text = text.replace(
              excel_marker,
              excel_marker + "\n    const ExcelJS = await excelLibrariesPromise;",
              1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Make footer asset local
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/utils/pdfFooterPatch.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import { jsPDF } from 'jspdf';\n\n", "")
          text = text.replace("const TOPO_MINI_URL = 'https://raw.githubusercontent.com/Ivozeraa/log-zelia/main/src/assets/images/topo_mini.png';\n\n", "")
          text = text.replace("const loadImageAsDataUrl = async (url) => {\n  if (!url || typeof window === 'undefined') return null;\n\n  const response = await fetch(url, { mode: 'cors', cache: 'no-store' });\n  if (!response.ok) {\n    throw new Error(`Falha ao carregar footer: HTTP ${response.status}`);\n  }\n\n  const blob = await response.blob();\n  return await new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(reader.result);\n    reader.onerror = reject;\n    reader.readAsDataURL(blob);\n  });\n};\n\nexport const addPdfFooter = async (doc) => {\n  const footerDataUrl = await loadImageAsDataUrl(TOPO_MINI_URL);\n", "import topoMiniImg from '../assets/images/topo_mini.png';\n\nconst loadImageAsDataUrl = async (url) => {\n  if (!url || typeof window === 'undefined') return null;\n\n  const img = new Image();\n  img.crossOrigin = 'anonymous';\n  await new Promise((resolve, reject) => {\n    img.onload = resolve;\n    img.onerror = reject;\n    img.src = url;\n  });\n\n  const canvas = document.createElement('canvas');\n  canvas.width = img.naturalWidth;\n  canvas.height = img.naturalHeight;\n  canvas.getContext('2d').drawImage(img, 0, 0);\n  return canvas.toDataURL('image/png');\n};\n\nexport const addPdfFooter = async (doc) => {\n  const footerDataUrl = await loadImageAsDataUrl(topoMiniImg);\n")
          path.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          npm ci
          npm run build

      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/optimize-site.yml
          git add src/pages/Horarios.jsx src/utils/pdfFooterPatch.js
          git commit -m "perf: reduce initial bundle and auth blocking"
          git push origin HEAD:agent/fix-horarios-core
