name: Adjust Horarios UI v2

on:
  push:
    branches: [agent/fix-horarios-core]
    paths:
      - scripts/adjust_horarios_ui_v2.py
      - .github/workflows/adjust-horarios-ui-v2.yml

permissions:
  contents: write

jobs:
  adjust-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 1
      - name: Apply UI patch
        run: python scripts/adjust_horarios_ui_v2.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and publish
        run: |
          rm -f scripts/adjust_horarios_ui_v2.py scripts/adjust_horarios_ui.py .github/workflows/adjust-horarios-ui-v2.yml .github/workflows/adjust-horarios-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(horarios): improve professor pdt and multi-turma assignments"
          git push --force-with-lease origin HEAD:agent/fix-horarios-core
