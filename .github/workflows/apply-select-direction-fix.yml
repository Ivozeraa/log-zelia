name: Apply custom select direction fix
on:
  push:
    branches: [agent/fix-horarios-core]
    paths:
      - scripts/fix-select-direction.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix-select-direction.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/CustomSelect.jsx
          git commit -m "fix(ui): prefer opening custom selects below"
          git push origin HEAD:agent/fix-horarios-core
          git rm scripts/fix-select-direction.py .github/workflows/apply-select-direction-fix.yml
          git commit -m "chore: remove temporary select fix workflow"
          git push origin HEAD:agent/fix-horarios-core
