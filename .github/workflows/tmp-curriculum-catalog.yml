name: Apply curriculum catalog
on:
  push:
    branches: [agent/fix-horarios-core]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0
      - name: Patch Horarios and add migration source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/pages/Horarios.jsx')
          text = path.read_text(encoding='utf-8')

          if 'disciplinaCatalogo' in text:
              print('Catalog patch already present')
          else:
              marker = "const getCourseStyle = (turmaNome = '') => COURSE_STYLES.find((course) => course.match.test(turmaNome)) || DEFAULT_COURSE_STYLE;"
              insert = r'''
const CURRICULUM_COURSES = ['Administração', 'Eletrotécnica', 'Enfermagem', 'Informática'];
const catalogCourseFromTurma = (turmaNome = '') => {
  if (/eletro/i.test(turmaNome)) return 'Eletrotécnica';
  if (/enferm/i.test(turmaNome)) return 'Enfermagem';
  if (/inform[aá]tica/i.test(turmaNome)) return 'Informática';
  if (/adm/i.test(turmaNome)) return 'Administração';
  return '';
};
'''
              text = text.replace(marker, marker + insert, 1)

              state_marker = "  const [disciplinaForm, setDisciplinaForm] = useState({ nome: '', area_id: '' });"
              state_insert = r'''
  const [disciplinaCatalogo, setDisciplinaCatalogo] = useState([]);
  const [catalogModalOpen, setCatalogModalOpen] = useState(false);
  const [catalogCourse, setCatalogCourse] = useState('');
  const [catalogSerie, setCatalogSerie] = useState('1');
  const [catalogSelected, setCatalogSelected] = useState([]);
'''
              text = text.replace(state_marker, state_marker + state_insert, 1)

              options_marker = "  const professorUsers = useMemo("
              options_insert = r'''
  const catalogCourseOptions = useMemo(
    () => CURRICULUM_COURSES.map((curso) => ({ value: curso, label: curso })),
    [],
  );

  const catalogFilteredRows = useMemo(
    () => disciplinaCatalogo
      .filter((row) => !catalogCourse || row.curso === catalogCourse)
      .filter((row) => String(row.serie) === String(catalogSerie))
      .filter((row) => Number(row.semestre) === Number(currentConfig.semestre))
      .sort((a, b) => a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome)),
    [disciplinaCatalogo, catalogCourse, catalogSerie, currentConfig.semestre],
  );
'''
              text = text.replace(options_marker, options_insert + options_marker, 1)

              load_marker = "          supabase.from('usuarios').select('id, nome, escola_id, role_id, pdt').order('nome', { ascending: true }),"
              load_repl = load_marker + "\n          supabase.from('horario_disciplinas_catalogo').select('id, curso, curriculo, serie, semestre, nome, categoria, area_nome, ordem').eq('ativo', true).order('curso', { ascending: true }).order('serie', { ascending: true }).order('semestre', { ascending: true }).order('ordem', { ascending: true }),"
              text = text.replace(load_marker, load_repl, 1)
              users_set = "        setUsuarios(results[3].data || []);"
              users_set_repl = users_set + "\n        setDisciplinaCatalogo(results[4].data || []);"
              text = text.replace(users_set, users_set_repl, 1)

              fn_marker = "  const openDisciplinaModal = (discipline = null) => {"
              fn_insert = r'''
  const openDisciplinaCatalogModal = () => {
    const firstTurma = byId(turmas, currentConfig.turmas[0]);
    const inferredCourse = catalogCourseFromTurma(firstTurma?.nome);
    const inferredSerie = String((String(firstTurma?.nome || '').match(/(\d+)\s*º|\b(\d+)\b/) || [])[1] || '1');
    setCatalogCourse(inferredCourse || CURRICULUM_COURSES[0]);
    setCatalogSerie(inferredSerie);
    setCatalogSelected([]);
    setCatalogModalOpen(true);
  };

  const closeDisciplinaCatalogModal = () => {
    setCatalogModalOpen(false);
    setCatalogSelected([]);
  };

  const toggleCatalogDiscipline = (catalogId) => {
    setCatalogSelected((prev) => prev.includes(String(catalogId))
      ? prev.filter((id) => id !== String(catalogId))
      : [...prev, String(catalogId)]);
  };

  const addCatalogDisciplines = () => {
    const selectedRows = disciplinaCatalogo.filter((row) => catalogSelected.includes(String(row.id)));
    if (!selectedRows.length) return notify.error('Selecione pelo menos uma disciplina da base curricular.');

    setCurrentConfig((prev) => {
      const existingNames = new Set(prev.disciplinas.map((item) => item.nome.trim().toLowerCase()));
      const additions = selectedRows
        .filter((row) => !existingNames.has(row.nome.trim().toLowerCase()))
        .map((row) => {
          const area = prev.areas.find((item) => item.nome.trim().toLowerCase() === row.area_nome.trim().toLowerCase()) || prev.areas.find((item) => item.nome === 'Técnica');
          return { id: newId('disc'), nome: row.nome, area_id: String(area?.id || '') };
        })
        .filter((item) => item.area_id);
      return { ...prev, disciplinas: [...prev.disciplinas, ...additions] };
    });

    const addedCount = selectedRows.filter((row) => !currentConfig.disciplinas.some((item) => item.nome.trim().toLowerCase() === row.nome.trim().toLowerCase())).length;
    closeDisciplinaCatalogModal();
    notify.success(`${addedCount} disciplina(s) adicionada(s) da base curricular.`);
  };

'''
              text = text.replace(fn_marker, fn_insert + fn_marker, 1)

              step_marker = "            <div className=\"rounded-2xl border border-slate-200 bg-slate-50 p-5 dark:border-slate-700 dark:bg-slate-900\"><div className=\"flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between\"><div><h3 className=\"font-semibold text-slate-900 dark:text-white\">Disciplinas</h3><p className=\"mt-1 text-sm text-slate-500 dark:text-slate-400\">Cadastre aqui as matérias que serão usadas nas atribuições da Etapa 4.</p></div><Button type=\"button\" variant=\"secondary\" onClick={() => openDisciplinaModal()}><FaPlus className=\"mr-2\" /> Nova disciplina</Button></div></div>"
              step_repl = r'''            <div className="rounded-2xl border border-green-200 bg-green-50/70 p-5 dark:border-green-900 dark:bg-green-950/20">
              <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                <div>
                  <h3 className="font-semibold text-slate-900 dark:text-white">Base curricular</h3>
                  <p className="mt-1 max-w-3xl text-sm text-slate-600 dark:text-slate-300">Escolha o curso e a série para importar as disciplinas do semestre atual. Elas ficam preparadas no banco e podem ser reutilizadas em novas configurações.</p>
                </div>
                <Button type="button" onClick={openDisciplinaCatalogModal}><FaPlus className="mr-2" /> Importar da base curricular</Button>
              </div>
            </div>

''' + step_marker
              text = text.replace(step_marker, step_repl, 1)

              modal_marker = "      <Modal isOpen={disciplinaModalOpen} onClose={closeDisciplinaModal} title={editingDisciplinaId ? 'Editar disciplina' : 'Nova disciplina'}>"
              modal_insert = r'''      <Modal isOpen={catalogModalOpen} onClose={closeDisciplinaCatalogModal} title="Base curricular de disciplinas">
        <div className="space-y-5">
          <div className="grid gap-4 sm:grid-cols-2">
            <CustomSelect label="Curso" value={catalogCourse} onChange={setCatalogCourse} options={catalogCourseOptions} placeholder="Selecione o curso" />
            <CustomSelect label="Série" value={catalogSerie} onChange={setCatalogSerie} options={[1,2,3].map((serie) => ({ value: String(serie), label: `${serie}ª série` }))} placeholder="Selecione a série" />
          </div>
          <div className="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-900">
            <strong>{currentConfig.semestre}º semestre</strong> · currículo filtrado para a série selecionada.
          </div>
          <div className="max-h-[48vh] space-y-2 overflow-y-auto pr-1">
            {catalogFilteredRows.map((row) => {
              const checked = catalogSelected.includes(String(row.id));
              const alreadyAdded = currentConfig.disciplinas.some((item) => item.nome.trim().toLowerCase() === row.nome.trim().toLowerCase());
              return (
                <button key={row.id} type="button" disabled={alreadyAdded} onClick={() => toggleCatalogDiscipline(row.id)} className={`flex w-full items-start gap-3 rounded-xl border p-3 text-left transition ${alreadyAdded ? 'cursor-not-allowed border-slate-200 bg-slate-100 opacity-60 dark:border-slate-800 dark:bg-slate-900' : checked ? 'border-green-500 bg-green-50 dark:border-green-700 dark:bg-green-950/30' : 'border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-950'}`}>
                  <span className={`mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border ${checked ? 'border-green-600 bg-green-600 text-white' : 'border-slate-300 dark:border-slate-600'}`}>{checked && <FaCheck className="text-xs" />}</span>
                  <span className="min-w-0 flex-1"><span className="block font-semibold text-slate-900 dark:text-white">{row.nome}</span><span className="mt-1 block text-[11px] font-semibold text-slate-500 dark:text-slate-400">{row.categoria === 'profissional' ? 'Profissional' : row.categoria === 'diversificada' ? 'Diversificada' : 'Formação Geral'} · {row.area_nome}</span></span>
                </button>
              );
            })}
            {!catalogFilteredRows.length && <div className="rounded-xl border border-dashed border-slate-300 p-6 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">Nenhuma disciplina encontrada para este curso, série e semestre.</div>}
          </div>
          <div className="flex justify-end gap-3 border-t border-slate-200 pt-4 dark:border-slate-700">
            <Button type="button" variant="secondary" onClick={closeDisciplinaCatalogModal}>Cancelar</Button>
            <Button type="button" onClick={addCatalogDisciplines} disabled={!catalogSelected.length}>Adicionar selecionadas</Button>
          </div>
        </div>
      </Modal>

''' + modal_marker
              text = text.replace(modal_marker, modal_insert, 1)

              text = text.replace("    closeLinkModal();\n  };", "    closeLinkModal();\n    closeDisciplinaCatalogModal();\n  };", 1)

              path.write_text(text, encoding='utf-8')

          # Versioned migration source mirroring the already-applied catalog table.
          mig = Path('supabase/migrations/20260815184207_seed_horario_disciplinas_catalogo.sql')
          if not mig.exists():
              mig.write_text('''create table if not exists public.horario_disciplinas_catalogo (\n  id uuid primary key default gen_random_uuid(),\n  curso text not null,\n  curriculo text not null,\n  serie smallint not null check (serie between 1 and 3),\n  semestre smallint not null check (semestre between 1 and 2),\n  nome text not null,\n  categoria text not null check (categoria in (''general'',''profissional'',''diversificada'')),\n  area_nome text not null,\n  ordem smallint not null default 0,\n  ativo boolean not null default true,\n  created_at timestamptz not null default now(),\n  unique (curso, curriculo, serie, semestre, nome)\n);\n\ncreate index if not exists idx_horario_disciplinas_catalogo_filtros on public.horario_disciplinas_catalogo (curso, serie, semestre, ativo);\nalter table public.horario_disciplinas_catalogo enable row level security;\ndrop policy if exists horario_disciplinas_catalogo_select_authenticated on public.horario_disciplinas_catalogo;\ncreate policy horario_disciplinas_catalogo_select_authenticated on public.horario_disciplinas_catalogo for select to authenticated using (true);\n''', encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-curriculum-catalog.yml
          git add src/pages/Horarios.jsx supabase/migrations/20260815184207_seed_horario_disciplinas_catalogo.sql
          git commit -m "feat(horarios): add curriculum discipline catalog" || exit 0
          git push origin agent/fix-horarios-core
