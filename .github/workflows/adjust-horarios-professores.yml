name: Adjust Horarios Professors

on:
  push:
    branches:
      - agent/fix-horarios-core
    paths:
      - .github/workflows/adjust-horarios-professores.yml

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply horarios redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          horarios = Path('src/pages/Horarios.jsx')
          service = Path('src/services/horarioService.js')
          text = horarios.read_text(encoding='utf-8')

          text = text.replace(
              "const steps = [\n  'Configuração',\n  'Turmas',\n  'Professores e Áreas',\n  'Disciplinas e Atribuições',",
              "const PROFESSOR_ROLE_ID = 4;\n\nconst steps = [\n  'Configuração',\n  'Turmas',\n  'Professores, Áreas e Disciplinas',\n  'Atribuições',",
              1,
          )

          old_users = """  const professorUsers = useMemo(\n    () => usuarios\n      .filter((usuario) => !currentConfig.professores.some((professor) => String(professor.usuario_id) === String(usuario.id)))\n      .map((usuario) => ({ value: String(usuario.id), label: `${usuario.nome}${usuario.pdt ? ' · PDT' : ''}` })),\n    [usuarios, currentConfig.professores],\n  );"""
          new_users = """  const professorUsers = useMemo(\n    () => usuarios\n      .filter((usuario) => Number(usuario.role_id) === PROFESSOR_ROLE_ID)\n      .filter((usuario) => !currentConfig.professores.some((professor) => String(professor.usuario_id) === String(usuario.id)))\n      .map((usuario) => ({ value: String(usuario.id), label: `${usuario.nome}${usuario.pdt ? ' · PDT' : ''}` })),\n    [usuarios, currentConfig.professores],\n  );\n\n  const professorAssignmentGroups = useMemo(() => {\n    const groups = new Map();\n    currentConfig.professorTurmas.forEach((link) => {\n      const key = String(link.professor_id);\n      if (!groups.has(key)) groups.set(key, { professor_id: key, items: [] });\n      groups.get(key).items.push(link);\n    });\n    return Array.from(groups.values());\n  }, [currentConfig.professorTurmas]);"""
          if old_users not in text:
              raise SystemExit('professorUsers block not found')
          text = text.replace(old_users, new_users, 1)

          old_state = """  const [editingLinkId, setEditingLinkId] = useState(null);\n  const [linkDraft, setLinkDraft] = useState({\n    professor_id: '',\n    turma_id: '',\n    disciplina_id: '',\n    aulas_semana: 2,\n    max_aulas_consecutivas: 2,\n  });"""
          new_state = """  const [editingLinkProfessorId, setEditingLinkProfessorId] = useState(null);\n  const [linkDraft, setLinkDraft] = useState({\n    professor_id: '',\n    items: [{ id: newId('assignment-item'), turma_id: '', disciplina_id: '', aulas_semana: 2, max_aulas_consecutivas: 2 }],\n  });"""
          if old_state not in text:
              raise SystemExit('link state block not found')
          text = text.replace(old_state, new_state, 1)

          old_links = re.compile(r"  const openLinkModal = \(link = null\) => \{.*?  const removeLink = \(id\) => setCurrentConfig\(prev => \(\{.*?\n  \}\);", re.S)
          new_links = """  const newAssignmentItem = () => ({\n    id: newId('assignment-item'),\n    turma_id: '',\n    disciplina_id: '',\n    aulas_semana: 2,\n    max_aulas_consecutivas: 2,\n  });\n\n  const openLinkModal = (assignment = null) => {\n    setEditingLinkProfessorId(assignment?.professor_id || null);\n    setLinkDraft({\n      professor_id: assignment?.professor_id || '',\n      items: assignment?.items?.length\n        ? assignment.items.map((item) => ({\n            id: item.id || newId('assignment-item'),\n            turma_id: String(item.turma_id || ''),\n            disciplina_id: String(item.disciplina_id || ''),\n            aulas_semana: Number(item.aulas_semana || 2),\n            max_aulas_consecutivas: Number(item.max_aulas_consecutivas || 2),\n          }))\n        : [newAssignmentItem()],\n    });\n    setVinculoModalOpen(true);\n  };\n\n  const closeLinkModal = () => {\n    setVinculoModalOpen(false);\n    setEditingLinkProfessorId(null);\n    setLinkDraft({ professor_id: '', items: [newAssignmentItem()] });\n  };\n\n  const updateAssignmentItem = (itemId, field, value) => {\n    setLinkDraft((prev) => ({\n      ...prev,\n      items: prev.items.map((item) => String(item.id) === String(itemId) ? { ...item, [field]: value } : item),\n    }));\n  };\n\n  const addAssignmentItem = () => {\n    setLinkDraft((prev) => ({ ...prev, items: [...prev.items, newAssignmentItem()] }));\n  };\n\n  const removeAssignmentItem = (itemId) => {\n    setLinkDraft((prev) => ({\n      ...prev,\n      items: prev.items.length > 1 ? prev.items.filter((item) => String(item.id) !== String(itemId)) : prev.items,\n    }));\n  };\n\n  const saveLinkFromModal = () => {\n    if (!linkDraft.professor_id || !byId(currentConfig.professores, linkDraft.professor_id)) {\n      return notify.error('Selecione um professor válido.');\n    }\n\n    const seenTurmas = new Set();\n    const items = linkDraft.items.map((item) => ({\n      ...item,\n      turma_id: String(item.turma_id || ''),\n      disciplina_id: String(item.disciplina_id || ''),\n      aulas_semana: Number(item.aulas_semana),\n      max_aulas_consecutivas: Number(item.max_aulas_consecutivas),\n    }));\n\n    for (const item of items) {\n      if (!currentConfig.turmas.map(String).includes(item.turma_id) || !byId(currentConfig.disciplinas, item.disciplina_id) || !Number.isFinite(item.aulas_semana) || item.aulas_semana <= 0 || !Number.isFinite(item.max_aulas_consecutivas) || item.max_aulas_consecutivas <= 0) {\n        return notify.error('Cada linha precisa de turma, matéria, aulas por semana e máximo de consecutivas válidos.');\n      }\n      if (seenTurmas.has(item.turma_id)) {\n        return notify.error('Cada turma pode aparecer apenas uma vez na mesma atribuição.');\n      }\n      seenTurmas.add(item.turma_id);\n    }\n\n    const professorId = String(linkDraft.professor_id);\n    setCurrentConfig((prev) => ({\n      ...prev,\n      professorTurmas: [\n        ...prev.professorTurmas.filter((item) => String(item.professor_id) !== professorId),\n        ...items.map((item) => ({\n          id: newId('link'),\n          professor_id: professorId,\n          turma_id: item.turma_id,\n          disciplina_id: item.disciplina_id,\n          aulas_semana: item.aulas_semana,\n          max_aulas_consecutivas: item.max_aulas_consecutivas,\n        })),\n      ],\n    }));\n    closeLinkModal();\n  };\n\n  const removeAssignment = (professorId) => setCurrentConfig((prev) => ({\n    ...prev,\n    professorTurmas: prev.professorTurmas.filter((item) => String(item.professor_id) !== String(professorId)),\n  }));"""
          if not old_links.search(text):
              raise SystemExit('link functions block not found')
          text = old_links.sub(new_links, text, count=1)

          text = text.replace(
              "if (!usuario) return notify.error('Professor selecionado não foi encontrado.');",
              "if (!usuario) return notify.error('Professor selecionado não foi encontrado.');\n    if (Number(usuario.role_id) !== PROFESSOR_ROLE_ID) return notify.error('Somente usuários com cargo de professor podem ser adicionados.');",
              1,
          )

          text = text.replace(
              "options={editingProfessorId ? usuarios.map((usuario) => ({ value: String(usuario.id), label: `${usuario.nome}${usuario.pdt ? ' · PDT' : ''}` })) : professorUsers}",
              "options={(editingProfessorId ? usuarios : usuarios.filter((usuario) => Number(usuario.role_id) === PROFESSOR_ROLE_ID)).map((usuario) => ({ value: String(usuario.id), label: `${usuario.nome}${usuario.pdt ? ' · PDT' : ''}` }))}",
              1,
          )

          old_next = """    if (currentStep === 3 && currentConfig.professores.some((professor) => !byId(currentConfig.areas, professor.area_id))) return notify.error('Todos os professores precisam de uma área válida.');\n    if (currentStep === 4) {"""
          new_next = """    if (currentStep === 3 && currentConfig.professores.some((professor) => !byId(currentConfig.areas, professor.area_id))) return notify.error('Todos os professores precisam de uma área válida.');\n    if (currentStep === 3 && !currentConfig.disciplinas.length) return notify.error('Cadastre pelo menos uma disciplina antes de avançar.');\n    if (currentStep === 4) {"""
          if old_next not in text:
              raise SystemExit('nextStep block not found')
          text = text.replace(old_next, new_next, 1)

          step3_start = text.index("        {currentStep === 3 && (")
          step4_start = text.index("        {currentStep === 4 && (", step3_start)
          step5_start = text.index("        {currentStep === 5 && (", step4_start)

          step3 = '''        {currentStep === 3 && (\n          <div className="space-y-6">\n            <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5 dark:border-slate-700 dark:bg-slate-900">\n              <div className="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">\n                <div>\n                  <h3 className="font-semibold text-slate-900 dark:text-white">Professores e áreas</h3>\n                  <p className="mt-1 max-w-2xl text-sm text-slate-500 dark:text-slate-400">Adicione somente usuários da escola com cargo de professor e defina a área de cada um para esta configuração.</p>\n                </div>\n                <Button type="button" onClick={() => openProfessorModal()}><FaUserPlus className="mr-2" /> Adicionar professor</Button>\n              </div>\n              <div className="mt-4 flex flex-wrap gap-2">\n                {currentConfig.areas.map((area) => <span key={area.id} className="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-800 dark:bg-green-950 dark:text-green-300">{area.nome}</span>)}\n              </div>\n            </div>\n\n            <div className="space-y-3">\n              {currentConfig.professores.map((professor) => {\n                const usuario = byId(usuarios, professor.usuario_id);\n                const pdtTurma = Object.entries(currentConfig.pdt || {}).find(([, professorId]) => String(professorId) === String(professor.id))?.[0];\n                return (\n                  <div key={professor.id} className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-950">\n                    <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">\n                      <div className="min-w-0">\n                        <div className="flex flex-wrap items-center gap-2">\n                          <p className="font-semibold text-slate-900 dark:text-white">{professor.nome}</p>\n                          {usuario?.pdt && <span className="rounded-full bg-amber-100 px-2.5 py-1 text-[11px] font-bold text-amber-800 dark:bg-amber-950 dark:text-amber-200">PDT</span>}\n                        </div>\n                        <div className="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 dark:text-slate-400">\n                          <span>{byId(currentConfig.areas, professor.area_id)?.nome || 'Área pendente'}</span>\n                          <span>Máx. {professor.max_aulas_consecutivas_default || 2} consecutivas</span>\n                          {pdtTurma && <span>PDT: {byId(turmas, pdtTurma)?.nome || 'Turma'}</span>}\n                        </div>\n                      </div>\n                      <div className="flex flex-wrap gap-2">\n                        <Button type="button" variant="secondary" onClick={() => openProfessorModal(professor)}>Editar</Button>\n                        <button type="button" onClick={() => removeProfessor(professor.id)} className="rounded-xl px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-50 dark:hover:bg-red-950"><FaTrash /></button>\n                      </div>\n                    </div>\n                  </div>\n                );\n              })}\n              {!currentConfig.professores.length && <div className="rounded-2xl border border-dashed border-slate-300 p-8 text-center dark:border-slate-700"><p className="font-semibold text-slate-700 dark:text-slate-200">Nenhum professor adicionado</p><p className="mt-1 text-sm text-slate-500 dark:text-slate-400">Use o botão acima para adicionar professores com cargo de professor.</p></div>}\n            </div>\n\n            <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5 dark:border-slate-700 dark:bg-slate-900">\n              <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">\n                <div>\n                  <h3 className="font-semibold text-slate-900 dark:text-white">Disciplinas</h3>\n                  <p className="mt-1 text-sm text-slate-500 dark:text-slate-400">Cadastre aqui todas as matérias que poderão ser distribuídas na Etapa 4.</p>\n                </div>\n                <Button type="button" variant="secondary" onClick={() => openDisciplinaModal()}><FaPlus className="mr-2" /> Nova disciplina</Button>\n              </div>\n            </div>\n\n            <div>\n              <div className="mb-3 flex items-center justify-between">\n                <h3 className="font-semibold text-slate-900 dark:text-white">Disciplinas cadastradas</h3>\n                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">{currentConfig.disciplinas.length} disciplina(s)</span>\n              </div>\n              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">\n                {currentConfig.disciplinas.map((discipline) => (\n                  <div key={discipline.id} className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-950">\n                    <div className="flex items-start justify-between gap-3">\n                      <div className="min-w-0">\n                        <p className="font-semibold text-slate-900 dark:text-white">{discipline.nome}</p>\n                        <span className="mt-2 inline-flex rounded-full bg-green-100 px-2.5 py-1 text-[11px] font-bold text-green-800 dark:bg-green-950 dark:text-green-300">\n                          {byId(currentConfig.areas, discipline.area_id)?.nome || 'Área inválida'}\n                        </span>\n                      </div>\n                      <div className="flex gap-1">\n                        <button type="button" onClick={() => openDisciplinaModal(discipline)} className="rounded-lg px-2 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-100 hover:text-slate-800 dark:hover:bg-slate-800 dark:hover:text-white">Editar</button>\n                        <button type="button" onClick={() => removeDisciplina(discipline.id)} className="rounded-lg px-2 py-1 text-xs font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-950">Excluir</button>\n                      </div>\n                    </div>\n                  </div>\n                ))}\n              </div>\n              {!currentConfig.disciplinas.length && <div className="rounded-2xl border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">Nenhuma disciplina cadastrada.</div>}\n            </div>\n          </div>\n        )}\n\n'''

          step4 = '''        {currentStep === 4 && (\n          <div className="space-y-6">\n            <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5 dark:border-slate-700 dark:bg-slate-900">\n              <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">\n                <div>\n                  <h3 className="font-semibold text-slate-900 dark:text-white">Atribuições por professor</h3>\n                  <p className="mt-1 max-w-3xl text-sm text-slate-500 dark:text-slate-400">Crie uma única atribuição por professor e, dentro dela, adicione várias turmas. Cada turma recebe sua própria matéria e carga semanal.</p>\n                </div>\n                <Button type="button" onClick={() => openLinkModal()}><FaPlus className="mr-2" /> Nova atribuição</Button>\n              </div>\n            </div>\n\n            <div className="space-y-4">\n              {professorAssignmentGroups.map((assignment) => {\n                const professor = byId(currentConfig.professores, assignment.professor_id);\n                return (\n                  <div key={assignment.professor_id} className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-950">\n                    <div className="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">\n                      <div className="min-w-0 flex-1">\n                        <div className="flex flex-wrap items-center gap-2">\n                          <h3 className="font-semibold text-slate-900 dark:text-white">{professor?.nome || 'Professor'}</h3>\n                          <span className="rounded-full bg-green-100 px-2.5 py-1 text-[11px] font-bold text-green-800 dark:bg-green-950 dark:text-green-300">{assignment.items.length} turma(s)</span>\n                        </div>\n                        <div className="mt-4 space-y-2">\n                          {assignment.items.map((item) => (\n                            <div key={item.id} className="grid gap-3 rounded-xl border border-slate-100 bg-slate-50 p-3 sm:grid-cols-[1fr_1fr_auto_auto] sm:items-center dark:border-slate-800 dark:bg-slate-900">\n                              <div><span className="text-[10px] font-bold uppercase tracking-wide text-slate-400">Turma</span><p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{byId(turmas, item.turma_id)?.nome || 'Turma'}</p></div>\n                              <div><span className="text-[10px] font-bold uppercase tracking-wide text-slate-400">Matéria</span><p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{byId(currentConfig.disciplinas, item.disciplina_id)?.nome || 'Disciplina'}</p></div>\n                              <div className="rounded-lg bg-white px-3 py-2 text-center dark:bg-slate-950"><div className="text-sm font-bold text-slate-900 dark:text-white">{item.aulas_semana}</div><div className="text-[10px] uppercase tracking-wide text-slate-400">aulas/sem.</div></div>\n                              <div className="rounded-lg bg-white px-3 py-2 text-center dark:bg-slate-950"><div className="text-sm font-bold text-slate-900 dark:text-white">{item.max_aulas_consecutivas}</div><div className="text-[10px] uppercase tracking-wide text-slate-400">máx.</div></div>\n                            </div>\n                          ))}\n                        </div>\n                      </div>\n                      <div className="flex shrink-0 gap-2">\n                        <Button type="button" variant="secondary" onClick={() => openLinkModal(assignment)}>Editar</Button>\n                        <button type="button" onClick={() => removeAssignment(assignment.professor_id)} className="rounded-xl p-2 text-red-600 transition hover:bg-red-50 dark:hover:bg-red-950"><FaTrash /></button>\n                      </div>\n                    </div>\n                  </div>\n                );\n              })}\n            </div>\n\n            {!professorAssignmentGroups.length && <div className="rounded-2xl border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">Nenhuma atribuição cadastrada. Crie uma para cada professor que tenha turmas e matérias vinculadas.</div>}\n          </div>\n        )}\n\n'''

          text = text[:step3_start] + step3 + step4 + text[step5_start:]

          modal_start = text.index('      <Modal isOpen={vinculoModalOpen}')
          modal_end = text.index('      </Modal>', modal_start) + len('      </Modal>')
          new_assignment_modal = '''      <Modal isOpen={vinculoModalOpen} onClose={closeLinkModal} title={editingLinkProfessorId ? 'Editar atribuição' : 'Nova atribuição'}>\n        <div className="space-y-5">\n          <CustomSelect\n            label="Professor"\n            value={linkDraft.professor_id}\n            onChange={(value) => setLinkDraft((prev) => ({ ...prev, professor_id: value }))}\n            options={editingLinkProfessorId ? professorOptions : professorOptions.filter((option) => !professorAssignmentGroups.some((assignment) => String(assignment.professor_id) === String(option.value)))}\n            placeholder="Selecione o professor"\n            showSearch\n            emptyLabel="Nenhum professor disponível"\n            disabled={Boolean(editingLinkProfessorId)}\n          />\n\n          <div className="space-y-3">\n            <div className="flex items-center justify-between gap-3">\n              <div>\n                <h4 className="font-semibold text-slate-900 dark:text-white">Turmas e matérias</h4>\n                <p className="text-xs text-slate-500 dark:text-slate-400">Escolha uma matéria diferente para cada turma dentro da mesma atribuição.</p>\n              </div>\n              <Button type="button" variant="secondary" onClick={addAssignmentItem}><FaPlus className="mr-2" /> Adicionar turma</Button>\n            </div>\n\n            {linkDraft.items.map((item, index) => (\n              <div key={item.id} className="rounded-2xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-900">\n                <div className="mb-3 flex items-center justify-between gap-3">\n                  <span className="text-xs font-bold uppercase tracking-wide text-slate-500">Turma {index + 1}</span>\n                  {linkDraft.items.length > 1 && <button type="button" onClick={() => removeAssignmentItem(item.id)} className="rounded-lg p-2 text-red-600 transition hover:bg-red-50 dark:hover:bg-red-950"><FaTrash /></button>}\n                </div>\n                <div className="grid gap-4 sm:grid-cols-2">\n                  <CustomSelect label="Turma" value={item.turma_id} onChange={(value) => updateAssignmentItem(item.id, 'turma_id', value)} options={turmaOptions.filter((option) => currentConfig.turmas.includes(String(option.value)))} placeholder="Selecione a turma" emptyLabel="Selecione turmas na Etapa 2" />\n                  <CustomSelect label="Matéria" value={item.disciplina_id} onChange={(value) => updateAssignmentItem(item.id, 'disciplina_id', value)} options={disciplinaOptions} placeholder="Selecione a matéria" emptyLabel="Cadastre disciplinas na Etapa 3" />\n                  <FormInput label="Aulas por semana" type="number" min="1" value={item.aulas_semana} onChange={(event) => updateAssignmentItem(item.id, 'aulas_semana', Number(event.target.value) || 0)} />\n                  <FormInput label="Máx. de aulas consecutivas" type="number" min="1" value={item.max_aulas_consecutivas} onChange={(event) => updateAssignmentItem(item.id, 'max_aulas_consecutivas', Number(event.target.value) || 0)} />\n                </div>\n              </div>\n            ))}\n          </div>\n\n          <div className="flex justify-end gap-3 border-t border-slate-200 pt-4 dark:border-slate-700">\n            <Button type="button" variant="secondary" onClick={closeLinkModal}>Cancelar</Button>\n            <Button type="button" onClick={saveLinkFromModal}>{editingLinkProfessorId ? 'Salvar atribuição' : 'Criar atribuição'}</Button>\n          </div>\n        </div>\n      </Modal>'''
          text = text[:modal_start] + new_assignment_modal + text[modal_end:]

          text = text.replace(
              "<span className=\"mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500\">Atribuições</span>{currentConfig.professorTurmas.map((link) => <p key={link.id} className=\"text-sm text-slate-700 dark:text-slate-300\">{byId(currentConfig.professores, link.professor_id)?.nome || 'Professor'} · {byId(turmas, link.turma_id)?.nome || 'Turma'} · {byId(currentConfig.disciplinas, link.disciplina_id)?.nome || 'Disciplina'} · {link.aulas_semana} aulas/semana</p>)}</div>",
              "<span className=\"mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500\">Atribuições</span>{professorAssignmentGroups.map((assignment) => <div key={assignment.professor_id} className=\"mb-3 last:mb-0\"><p className=\"font-semibold text-slate-800 dark:text-slate-200\">{byId(currentConfig.professores, assignment.professor_id)?.nome || 'Professor'}</p>{assignment.items.map((item) => <p key={item.id} className=\"ml-3 text-sm text-slate-700 dark:text-slate-300\">{byId(turmas, item.turma_id)?.nome || 'Turma'} · {byId(currentConfig.disciplinas, item.disciplina_id)?.nome || 'Disciplina'} · {item.aulas_semana} aulas/semana</p>)}</div>)}</div>",
              1,
          )

          horarios.write_text(text, encoding='utf-8')

          s = service.read_text(encoding='utf-8')
          old_scheduler = re.compile(r"  tasks\.forEach\(\(task, order\) => \{.*?\n  \}\);\n\n  const grid = generated\.reduce", re.S)
          new_scheduler = '''  tasks.forEach((task, order) => {\n    let remaining = task.aulas;\n    let distributed = 0;\n    const professorId = String(task.professor_id);\n    const turmaId = String(task.turma_id);\n\n    const canUseSlot = (day, slot) => {\n      const key = slotKey(day, slot);\n      return !(\n        (folgaMap[professorId] || []).includes(day) ||\n        (indisponibilidadeMap[professorId] || []).includes(key) ||\n        (formacaoMap[String(task.disciplina.area_id)] || []).includes(key) ||\n        professorSchedule[professorId]?.[key] ||\n        turmaSchedule[turmaId]?.[key]\n      );\n    };\n\n    const placeLesson = (day, slot) => {\n      const key = slotKey(day, slot);\n      const record = {\n        turma_id: turmaId,\n        turma_nome: task.turma.nome || 'Turma',\n        professor_id: professorId,\n        professor_nome: task.professor.nome || 'Professor',\n        disciplina_id: task.disciplina.id,\n        disciplina: task.disciplina.nome || 'Disciplina',\n        dia: day,\n        slot,\n        tipo: 'Regular',\n        ordem: order,\n      };\n      turmaSchedule[turmaId] ||= {};\n      professorSchedule[professorId] ||= {};\n      turmaSchedule[turmaId][key] = record;\n      professorSchedule[professorId][key] = record;\n      generated.push(record);\n      distributed += 1;\n      remaining -= 1;\n    };\n\n    if (task.aulas === 2) {\n      const pairCandidates = [];\n      WEEK_DAYS.forEach((day) => {\n        SLOT_DEFINITIONS.forEach(({ slot: firstSlot }, index) => {\n          const secondSlot = SLOT_DEFINITIONS[index + 1]?.slot;\n          if (secondSlot == null) return;\n\n          const firstDefinition = SLOT_DEFINITIONS[index];\n          const secondDefinition = SLOT_DEFINITIONS[index + 1];\n          if (firstDefinition.time.split(' - ')[1] !== secondDefinition.time.split(' - ')[0]) return;\n          if (!canUseSlot(day, firstSlot) || !canUseSlot(day, secondSlot)) return;\n\n          const projected = { ...(professorSchedule[professorId] || {}) };\n          projected[slotKey(day, firstSlot)] = { dia: day, slot: firstSlot };\n          projected[slotKey(day, secondSlot)] = { dia: day, slot: secondSlot };\n          if (consecutiveIfPlaced(projected, day, secondSlot) > task.maxConsecutivo) return;\n\n          const turmaLoad = daySlots(turmaSchedule[turmaId], day).length;\n          const professorLoad = daySlots(professorSchedule[professorId], day).length;\n          const adjacent = adjacentCount(professorSchedule[professorId] || {}, day, firstSlot) + adjacentCount(professorSchedule[professorId] || {}, day, secondSlot);\n          pairCandidates.push({ day, firstSlot, secondSlot, score: adjacent * 20 - turmaLoad * 3 - professorLoad * 2 });\n        });\n      });\n\n      pairCandidates.sort((a, b) => b.score - a.score || a.firstSlot - b.firstSlot || WEEK_DAYS.indexOf(a.day) - WEEK_DAYS.indexOf(b.day));\n      const pair = pairCandidates[0];\n      if (pair) {\n        placeLesson(pair.day, pair.firstSlot);\n        placeLesson(pair.day, pair.secondSlot);\n        return;\n      }\n\n      const problem = {\n        professor: task.professor.nome,\n        professor_id: task.professor_id,\n        turma: task.turma.nome,\n        turma_id: task.turma_id,\n        disciplina: task.disciplina.nome,\n        disciplina_id: task.disciplina.id,\n        solicitadas: 2,\n        distribuídas: 0,\n        restantes: 2,\n        mensagem: 'As 2 aulas semanais desta disciplina precisam ser alocadas em dois horários consecutivos no mesmo período, mas nenhuma dupla compatível foi encontrada.',\n      };\n      addProblem(validation, problem);\n      unscheduled.push(problem);\n      return;\n    }\n\n    while (remaining > 0) {\n      const candidates = [];\n      WEEK_DAYS.forEach((day) => SLOT_DEFINITIONS.forEach(({ slot }) => {\n        if (!canUseSlot(day, slot)) return;\n        if (consecutiveIfPlaced(professorSchedule[professorId] || {}, day, slot) > task.maxConsecutivo) return;\n        const adjacent = adjacentCount(professorSchedule[professorId] || {}, day, slot);\n        const turmaLoad = daySlots(turmaSchedule[turmaId], day).length;\n        const professorLoad = daySlots(professorSchedule[professorId], day).length;\n        candidates.push({ day, slot, score: adjacent * 20 - turmaLoad * 3 - professorLoad * 2 + (remaining === 1 ? 1 : 0) });\n      }));\n      candidates.sort((a, b) => b.score - a.score || a.slot - b.slot || WEEK_DAYS.indexOf(a.day) - WEEK_DAYS.indexOf(b.day));\n      const candidate = candidates[0];\n      if (!candidate) break;\n      placeLesson(candidate.day, candidate.slot);\n    }\n\n    if (remaining > 0) {\n      const problem = { professor: task.professor.nome, professor_id: task.professor_id, turma: task.turma.nome, turma_id: task.turma_id, disciplina: task.disciplina.nome, disciplina_id: task.disciplina.id, solicitadas: task.aulas, distribuídas: distributed, restantes: remaining, mensagem: 'Não foi possível distribuir todas as aulas dentro das restrições de disponibilidade, formação, conflitos e consecutivas.' };\n      addProblem(validation, problem);\n      unscheduled.push(problem);\n    }\n  });\n\n  const grid = generated.reduce'''
          if not old_scheduler.search(s):
              raise SystemExit('scheduler block not found')
          s = old_scheduler.sub(new_scheduler, s, count=1)
          service.write_text(s, encoding='utf-8')
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/adjust-horarios-professores.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Horarios.jsx src/services/horarioService.js .github/workflows/adjust-horarios-professores.yml
          git commit -m "feat(horarios): restructure disciplines assignments and consecutive lessons"
          git push origin HEAD:${GITHUB_REF_NAME}
