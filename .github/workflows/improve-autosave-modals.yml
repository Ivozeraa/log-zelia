name: Improve autosave and modal selects
on:
  push:
    branches: [agent/fix-horarios-core]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 1
      - name: Patch CustomSelect and Modal
        run: |
          cat > src/components/ui/CustomSelect.jsx <<'EOF'
          import { useEffect, useRef, useState } from "react";
          
          export const CustomSelect = ({
            label,
            value,
            onChange,
            options = [],
            placeholder = "Selecione...",
            disabled = false,
            className = "",
            emptyLabel = "Nenhum item encontrado",
            showSearch = false,
            multiple = false,
            showSelectedValues = true,
          }) => {
            const [open, setOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState("");
            const [menuMinWidth, setMenuMinWidth] = useState(240);
            const [menuPosition, setMenuPosition] = useState(null);
            const rootRef = useRef(null);
            const triggerRef = useRef(null);

            useEffect(() => {
              const labels = [placeholder, ...options.map((option) => option.label)];
              const maxLength = Math.max(0, ...labels.map((item) => String(item || '').length));
              setMenuMinWidth(Math.min(Math.max(240, Math.round(maxLength * 7.2 + 72)), 720));
            }, [options, placeholder]);

            useEffect(() => {
              const handleClickOutside = (event) => {
                if (rootRef.current && !rootRef.current.contains(event.target)) {
                  setOpen(false);
                  setSearchTerm("");
                }
              };
              document.addEventListener("mousedown", handleClickOutside);
              return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            useEffect(() => {
              if (!open || !triggerRef.current) return undefined;

              const updatePosition = () => {
                const rect = triggerRef.current.getBoundingClientRect();
                const viewportPadding = 12;
                const gap = 8;
                const width = Math.min(
                  Math.max(rect.width, menuMinWidth),
                  window.innerWidth - viewportPadding * 2,
                );
                const left = Math.max(
                  viewportPadding,
                  Math.min(rect.left, window.innerWidth - width - viewportPadding),
                );
                const spaceBelow = window.innerHeight - rect.bottom - viewportPadding - gap;
                const spaceAbove = rect.top - viewportPadding - gap;
                const openAbove = spaceBelow < 220 && spaceAbove > spaceBelow;
                const maxHeight = Math.max(
                  150,
                  Math.min(360, openAbove ? spaceAbove : spaceBelow),
                );
                const top = openAbove
                  ? Math.max(viewportPadding, rect.top - maxHeight - gap)
                  : rect.bottom + gap;

                setMenuPosition({ top, left, width, maxHeight });
              };

              updatePosition();
              window.addEventListener("resize", updatePosition);
              window.addEventListener("scroll", updatePosition, true);
              return () => {
                window.removeEventListener("resize", updatePosition);
                window.removeEventListener("scroll", updatePosition, true);
              };
            }, [open, menuMinWidth]);

            const selectedValues = multiple ? (Array.isArray(value) ? value : []) : null;

            const getDisplayLabel = () => {
              if (multiple) {
                if (!selectedValues?.length) return placeholder;
                if (selectedValues.length === 1) return options.find((o) => o.value === selectedValues[0])?.label ?? placeholder;
                return `${selectedValues.length} itens selecionados`;
              }
              return options.find((o) => o.value === value)?.label ?? placeholder;
            };

            const handleOptionClick = (optionValue) => {
              if (multiple) {
                if (optionValue === "") return;
                const current = Array.isArray(value) ? value : [];
                onChange(current.includes(optionValue) ? current.filter((v) => v !== optionValue) : [...current, optionValue]);
              } else {
                onChange(optionValue);
                setOpen(false);
                setSearchTerm("");
              }
            };

            const filteredOptions = showSearch
              ? options.filter((option) => option.value === "" || option.label.toLowerCase().includes(searchTerm.toLowerCase()))
              : options;
            const displayedOptions = multiple ? filteredOptions.filter((option) => option.value !== "") : filteredOptions;

            return (
              <div ref={rootRef} className={`relative flex flex-col gap-2 ${className}`}>
                {label && <label className="text-sm font-semibold text-slate-700 dark:text-slate-400">{label}</label>}
                <button
                  ref={triggerRef}
                  type="button"
                  disabled={disabled}
                  onClick={() => {
                    if (!open) setSearchTerm("");
                    setOpen((prev) => !prev);
                  }}
                  className={`flex h-12 w-full items-center justify-between rounded-xl border border-slate-300 bg-slate-50 px-3 text-left text-slate-900 outline-none transition focus:border-slate-400 dark:border-slate-700 dark:bg-slate-950 dark:text-white ${disabled ? "cursor-not-allowed bg-slate-100 text-slate-400 dark:bg-slate-800" : ""}`}
                >
                  <span className="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">{getDisplayLabel()}</span>
                  <span className="ml-2 shrink-0 text-slate-500">▾</span>
                </button>

                {multiple && showSelectedValues && selectedValues?.length > 0 && (
                  <div className="flex flex-wrap gap-1">
                    {selectedValues.map((v) => {
                      const opt = options.find((o) => o.value === v);
                      return (
                        <span key={v} className="flex items-center gap-1 rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-800">
                          {opt?.label ?? v}
                          <button type="button" onClick={() => handleOptionClick(v)} className="ml-0.5 text-green-600 hover:text-green-900" aria-label={`Remover ${opt?.label}`}>×</button>
                        </span>
                      );
                    })}
                  </div>
                )}

                {open && !disabled && menuPosition && (
                  <div
                    className="fixed z-[10050] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900"
                    style={{ top: menuPosition.top, left: menuPosition.left, width: menuPosition.width, maxHeight: menuPosition.maxHeight }}
                  >
                    <div className="flex max-h-full flex-col overflow-hidden">
                      {showSearch && (
                        <div className="shrink-0 border-b border-slate-200 bg-white p-2 dark:border-slate-700 dark:bg-slate-900">
                          <input
                            autoFocus
                            type="text"
                            placeholder="Pesquisar..."
                            value={searchTerm}
                            onChange={(event) => setSearchTerm(event.target.value)}
                            className="w-full rounded-lg border border-slate-300 px-2 py-2 text-sm outline-none focus:border-slate-400 dark:border-slate-700 dark:bg-slate-950 dark:text-white"
                          />
                        </div>
                      )}
                      <div className="min-h-0 flex-1 overflow-y-auto">
                        {displayedOptions.length > 0 ? displayedOptions.map((option) => {
                          const isSelected = multiple && selectedValues?.includes(option.value);
                          return (
                            <button key={option.value} type="button" onClick={() => handleOptionClick(option.value)} className={`flex w-full items-center gap-2 px-3 py-3 text-left text-slate-900 transition hover:bg-slate-100 dark:text-white dark:hover:bg-slate-800 ${isSelected ? "bg-green-50 dark:bg-green-950" : ""}`}>
                              {multiple && <span className={`flex h-4 w-4 shrink-0 items-center justify-center rounded border ${isSelected ? "border-green-600 bg-green-600 text-white" : "border-slate-300"}`}>{isSelected && "✓"}</span>}
                              <span className="min-w-0 truncate">{option.label}</span>
                            </button>
                          );
                        }) : <div className="px-3 py-3 text-sm text-slate-500">{emptyLabel}</div>}
                      </div>
                      {multiple && (
                        <div className="shrink-0 border-t border-slate-200 bg-white p-2 dark:border-slate-700 dark:bg-slate-900">
                          <button type="button" onClick={() => { setOpen(false); setSearchTerm(""); }} className="w-full rounded-xl bg-green-700 py-2 text-sm font-semibold text-white transition hover:bg-green-800">Confirmar</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          };
          EOF

          cat > src/components/ui/Modal.jsx <<'EOF'
          import { useEffect, useState } from "react";
          import { createPortal } from "react-dom";
          import { FaTimes } from "react-icons/fa";
          
          export const Modal = ({ isOpen, onClose, children, title }) => {
            const [show, setShow] = useState(false);
            const [animate, setAnimate] = useState(false);

            useEffect(() => {
              let timeout;
              if (isOpen) {
                setShow(true);
                document.body.style.overflow = "hidden";
                timeout = setTimeout(() => setAnimate(true), 10);
              } else {
                setAnimate(false);
                document.body.style.overflow = "";
                timeout = setTimeout(() => setShow(false), 200);
              }
              return () => clearTimeout(timeout);
            }, [isOpen]);

            useEffect(() => () => { document.body.style.overflow = ""; }, []);

            if (!show) return null;

            return createPortal(
              <div className="fixed inset-0 z-[9999] flex items-center justify-center overflow-y-auto px-4 py-6">
                <div onClick={onClose} className={`absolute inset-0 z-[9998] bg-black/50 backdrop-blur-sm transition-opacity duration-200 ${animate ? "opacity-100" : "opacity-0"}`} />
                <div
                  onClick={(event) => event.stopPropagation()}
                  className={`relative z-[9999] my-auto flex w-fit min-w-[min(92vw,32rem)] max-w-[min(94vw,54rem)] flex-col overflow-visible rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-700 dark:bg-slate-950 transform transition-all duration-200 ${animate ? "opacity-100 scale-100 translate-y-0" : "opacity-0 scale-95 translate-y-4"}`}
                >
                  {title && (
                    <div className="flex shrink-0 items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-700">
                      <h2 className="text-2xl font-semibold text-slate-900 dark:text-white">{title}</h2>
                      <button type="button" onClick={onClose} className="rounded-full p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 dark:hover:bg-slate-700 dark:hover:text-white"><FaTimes /></button>
                    </div>
                  )}
                  <div className="w-full overflow-visible px-6 pb-6 pt-4">
                    {children}
                  </div>
                </div>
              </div>,
              document.body,
            );
          };
          EOF

          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/Horarios.jsx')
          s = p.read_text(encoding='utf-8')
          if 'const [autosaveStatus, setAutosaveStatus] = useState' not in s:
              s = s.replace('  const [saving, setSaving] = useState(false);', '  const [saving, setSaving] = useState(false);\n  const [autosaveStatus, setAutosaveStatus] = useState(\'\');', 1)
          # Preserve generated grades during configuration autosave.
          s = s.replace("for (const table of ['horario_grade_gerada', 'horario_pdt', 'horario_professor_turma'", "for (const table of ['horario_pdt', 'horario_professor_turma'", 1)
          next_step = '''  const nextStep = async () => {
            if (currentStep === 2 && !currentConfig.turmas.length) return notify.error('Selecione ao menos uma turma.');
            if (currentStep === 3 && currentConfig.professores.some((professor) => !byId(currentConfig.areas, professor.area_id))) return notify.error('Todos os professores precisam de uma área válida.');
            if (currentStep === 3 && !currentConfig.disciplinas.length) return notify.error('Cadastre pelo menos uma disciplina antes de avançar.');
            if (currentStep === 4) {
              const invalid = validateConfig(false);
              if (invalid.length) return notify.error(invalid[0].mensagem);
            }
            if (currentStep === 6) {
              const invalid = validateConfig(true);
              if (invalid.length) return notify.error(invalid[0].mensagem);
            }

            if (currentStep < 7) {
              setAutosaveStatus('Salvando alterações...');
              const saved = await saveConfiguration(currentStep === 6);
              if (!saved) {
                setAutosaveStatus('Falha ao salvar');
                return;
              }
              setAutosaveStatus('Salvo automaticamente');
              window.setTimeout(() => setAutosaveStatus(''), 1800);
            }

            setCurrentStep((step) => Math.min(7, step + 1));
          };'''
          pattern = r"  const nextStep = async \(\) => \{.*?\n  \};"
          s, count = re.subn(pattern, next_step, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('nextStep not found')
          # Hide selected chips only for the Etapa 4 turma selector.
          s = s.replace('showSearch />', 'showSearch showSelectedValues={false} />', 1)
          # Add a compact autosave indicator beside the stepper.
          needle = '        <div className="mb-6 grid gap-2 md:grid-cols-7">'
          if needle in s and 'autosaveStatus' not in s[s.index(needle):s.index(needle)+1000]:
              s = s.replace(needle, '        {autosaveStatus && <div className="mb-3 rounded-xl border border-green-200 bg-green-50 px-4 py-2 text-xs font-semibold text-green-800 dark:border-green-900 dark:bg-green-950/30 dark:text-green-300">{autosaveStatus}</div>}\n\n' + needle, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/improve-autosave-modals.yml
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/CustomSelect.jsx src/components/ui/Modal.jsx src/pages/Horarios.jsx .github/workflows/improve-autosave-modals.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(horarios): improve autosave and adaptive modal selects"
          git push origin agent/fix-horarios-core
