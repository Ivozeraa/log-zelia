name: Temporary users PDF styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-user-pdf-style.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply users PDF styling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply users PDF styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/Management.jsx')
          text = path.read_text(encoding='utf-8')

          if 'addPdfFooter' not in text:
              text = text.replace(
                  'import autoTable from "jspdf-autotable";\n',
                  'import autoTable from "jspdf-autotable";\nimport { addPdfFooter } from "../utils/pdfFooterPatch";\nimport logoImg from "../assets/images/logoEEEP.png";\n',
                  1,
              )

          new_function = '''  async function handleExportPDF() {
    try {
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 36;
      const today = new Date().toLocaleDateString("pt-BR");
      const schoolNames = [...new Set(
        filteredUsers.map((u) => getSchoolName(u.escola_id)).filter((name) => name && name !== "—"),
      )];
      const schoolName = schoolNames.length === 1 ? schoolNames[0] : "Todas as escolas";
      const reportTitle = "RELATÓRIO DE USUÁRIOS";

      const drawFittedPdfText = (text, { x, y, maxWidth, fontSize, minFontSize = 8, align = "left" }) => {
        const value = String(text || "");
        let currentSize = fontSize;
        doc.setFontSize(currentSize);
        while (currentSize > minFontSize && doc.getTextWidth(value) > maxWidth) {
          currentSize -= 0.5;
          doc.setFontSize(currentSize);
        }
        doc.text(value, x, y, { align, maxWidth });
      };

      doc.setFillColor(35, 146, 74);
      doc.rect(0, 0, pageWidth, 8, "F");
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.8);
      doc.line(margin, 92, pageWidth - margin, 92);

      try {
        doc.addImage(logoImg, "PNG", margin, 18, 56, 56);
      } catch (error) {
        console.warn("Logo da escola não pôde ser adicionada ao relatório:", error);
      }

      doc.setTextColor(15, 23, 42);
      doc.setFont("helvetica", "bold");
      drawFittedPdfText(schoolName, {
        x: margin + 70,
        y: 35,
        maxWidth: 225,
        fontSize: 14,
        minFontSize: 9,
      });

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(71, 85, 105);
      doc.text("LogView • Gestão escolar", margin + 70, 53);
      doc.text(`Emitido em ${today}`, margin + 70, 69);

      doc.setFont("helvetica", "bold");
      doc.setTextColor(22, 101, 52);
      drawFittedPdfText(reportTitle, {
        x: pageWidth - margin,
        y: 35,
        maxWidth: 220,
        fontSize: 13,
        minFontSize: 10,
        align: "right",
      });

      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(100, 116, 139);
      doc.text(`${filteredUsers.length} registro(s) no relatório`, pageWidth - margin, 53, { align: "right" });

      const tableData = filteredUsers.map((u) => [
        u.nome || "—",
        u.email || "—",
        getRoleLabel(u.role_id),
        getSchoolName(u.escola_id),
        u.pdt ? "Sim" : "Não",
      ]);

      autoTable(doc, {
        head: [["Nome", "E-mail", "Função", "Escola", "PDT"]],
        body: tableData,
        startY: 108,
        margin: { top: 108, left: margin, right: margin, bottom: 62 },
        styles: {
          font: "helvetica",
          fontSize: 8.5,
          cellPadding: 5,
          lineColor: [226, 232, 240],
          lineWidth: 0.4,
          textColor: [30, 41, 59],
          overflow: "linebreak",
          valign: "middle",
        },
        headStyles: {
          fillColor: [35, 146, 74],
          textColor: [255, 255, 255],
          fontStyle: "bold",
          fontSize: 8.5,
          halign: "left",
          cellPadding: 6,
        },
        alternateRowStyles: {
          fillColor: [248, 250, 252],
        },
        bodyStyles: {
          minCellHeight: 23,
        },
        columnStyles: {
          0: { cellWidth: 125, fontStyle: "bold" },
          1: { cellWidth: 145 },
          2: { cellWidth: 82 },
          3: { cellWidth: 125 },
          4: { cellWidth: "auto", halign: "center", fontStyle: "bold" },
        },
        didParseCell: (data) => {
          if (data.section === "body" && data.column.index === 4) {
            if (String(data.cell.raw || "").toLowerCase() === "sim") {
              data.cell.styles.textColor = [21, 128, 61];
            } else {
              data.cell.styles.textColor = [100, 116, 139];
            }
          }
        },
        willDrawPage: (data) => {
          if (data.pageNumber > 1) {
            doc.setFillColor(35, 146, 74);
            doc.rect(0, 0, pageWidth, 8, "F");
            doc.setFont("helvetica", "bold");
            doc.setFontSize(9);
            doc.setTextColor(71, 85, 105);
            drawFittedPdfText(schoolName, {
              x: margin,
              y: 28,
              maxWidth: 235,
              fontSize: 9,
              minFontSize: 7,
            });
            drawFittedPdfText(reportTitle, {
              x: pageWidth - margin,
              y: 28,
              maxWidth: 220,
              fontSize: 9,
              minFontSize: 7,
              align: "right",
            });
            doc.setDrawColor(226, 232, 240);
            doc.line(margin, 38, pageWidth - margin, 38);
          }
        },
      });

      await addPdfFooter(doc);

      doc.save(`relatorio-usuarios-${new Date().toISOString().split("T")[0]}.pdf`);
      notify.success("PDF exportado.");
    } catch (err) {
      console.error(err);
      notify.error("Erro ao exportar PDF.");
    }
  }
'''

          pattern = r'  async function handleExportPDF\(\) \{.*?\n  \}\n\n  async function loadTurmas'
          replacement = new_function + '\n  async function loadTurmas'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Não foi possível localizar handleExportPDF em Management.jsx')

          path.write_text(updated, encoding='utf-8')
          PY

          rm .github/workflows/temporary-user-pdf-style.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Management.jsx .github/workflows/temporary-user-pdf-style.yml
          git commit -m 'fix: alinhar estilo do PDF de usuários ao PDF de alunos'
          git push
