name: Apply horario UX improvements

on:
  push:
    branches: [agent/fix-horarios-core]

permissions:
  contents: write

jobs:
  improve:
    if: ${{ !contains(github.event.head_commit.message, 'feat(horarios): improve assignment UX') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-horarios-core
          fetch-depth: 0

      - name: Apply Horarios changes
        run: python3 scripts/improve_horarios_assignments.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Update shared Modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ui/Modal.jsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'className={`my-auto flex w-fit min-w-[min(92vw,32rem)] max-w-[min(94vw,54rem)] flex-col overflow-visible rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-700 dark:bg-slate-950 transform transition-all duration-200 ${animate ? "opacity-100 scale-100 translate-y-0" : "opacity-0 scale-95 translate-y-4"}`}',
              'className={`my-auto flex max-h-[calc(100dvh-2rem)] w-fit min-w-[min(92vw,32rem)] max-w-[min(94vw,54rem)] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl dark:border-slate-700 dark:bg-slate-950 transform transition-all duration-200 ${animate ? "opacity-100 scale-100 translate-y-0" : "opacity-0 scale-95 translate-y-4"}`}',
          )
          s = s.replace(
              '<div className="w-full overflow-visible px-6 pb-6 pt-4">',
              '<div className="min-h-0 w-full flex-1 overflow-y-auto overflow-x-visible px-6 pb-6 pt-4">',
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate shared Modal
        run: npm run build

      - name: Commit and clean helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/improve_horarios_assignments.py .github/workflows/apply-improve-horarios.yml 2>/dev/null || true
          git add src/pages/Horarios.jsx src/components/ui/Modal.jsx
          git commit -m "feat(horarios): improve assignment UX"
          git push origin agent/fix-horarios-core
